/* =====================================================

let currentUser = null;

let driverName =

let driverDocId = "";

let notificationEnabled =

let currentAudio =

let sendingRide =

let gpsStarted =

/* =====================================================
   音声
===================================================== */

const sounds = {

  normal:
    "mixkit-software-interface-start-2574.wav",

/* =====================================================
   Firebaseログイン
===================================================== */

async function start(){

  try{

    const credential =
      await signInAnonymously(auth);

    currentUser =
      credential.user;

    console.log(
      "Firebase認証OK",
      currentUser.uid
    );


    detectMode();

  }
  catch(error){

    console.error(
      error
    );

    alert(
      "Firebaseに接続できません。\n\n" +
      getErrorMessage(error)
    );

  }

}


/* =====================================================
   ドライバー登録
===================================================== */

window.registerDriver =
async function(){

  const input =
    document
      .getElementById(
        "driverNameInput"
      );

  const name =
    input.value.trim();


  if(!name){

    alert(
      "表示名を入力してください❤️"
    );

    return;

  }


  driverName =
    name;

  localStorage.setItem(
    "wolftaxi_driver_name",
    name
  );

  driverDocId =
    currentUser.uid;


  try{

    await ensureDriverDocument();

    showDriverScreen();

  }
  catch(error){

    alert(
      "ドライバー登録に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

};


/* =====================================================
   ドライバー情報作成
===================================================== */

async function ensureDriverDocument(){

  if(!currentUser){

    return;

  }


  const ref =
    doc(
      db,
      "drivers",
      currentUser.uid
    );


  const snap =
    await getDoc(ref);


  if(!snap.exists()){

    await setDoc(
      ref,
      {

        name:
          driverName,

        status:
          "available",

        latitude:
          null,

        longitude:
          null,

        updatedAt:
          serverTimestamp()

      }
    );

  }
  else{

    await updateDoc(
      ref,
      {

        name:
          driverName,

        status:
          "available",

        updatedAt:
          serverTimestamp()

      }
    );

  }

}


/* =====================================================
   画面切り替え
===================================================== */

function showCustomerScreen(){

  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverRegistration"
    )
    .style.display =
      "none";


  initCustomerMap();

  listenDrivers();

  if(currentCustomerRideId){

    listenCustomerRide(
      currentCustomerRideId
    );

  }

}


function showDriverScreen(){

  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverRegistration"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "driverDisplayName"
    )
    .textContent =
      "👨‍✈️ " + driverName;


  document
    .getElementById(
      "driverCurrentStatus"
    )
    .textContent =
      "状態：🟢 空車";


  initDriverMap();

  listenRides();

  startGPS();

}


/* =====================================================
   ドライバー画面URL判定
===================================================== */

function detectMode(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  if(
    params.get("driver") === "1"
  ){

    if(driverName){

      driverDocId =
        currentUser.uid;

      ensureDriverDocument()
        .then(
          ()=>{
            showDriverScreen();
          }
        )
        .catch(
          error=>{
            alert(
              "ドライバー情報の読み込みに失敗しました。\n\n" +
              getErrorMessage(error)
            );
          }
        );

    }
    else{

      document
        .getElementById(
          "driverRegistration"
        )
        .style.display =
          "block";

      document
        .getElementById(
          "customerScreen"
        )
        .style.display =
          "none";

    }

  }
  else{

    showCustomerScreen();

  }

}


/* =====================================================
   タクシー一覧監視
===================================================== */

function listenDrivers(){

  const q =
    query(
      collection(
        db,
        "drivers"
      )
    );


  onSnapshot(
    q,
    snapshot=>{

      const list =
        document.getElementById(
          "driverStatusList"
        );


      list.innerHTML =
        "";


      if(snapshot.empty){

        list.innerHTML =
          '<div class="small">' +
          '現在登録されているタクシーはありません。' +
          '</div>';

        return;

      }


      snapshot.forEach(
        driverDoc=>{

          const driver =
            driverDoc.data();


          const id =
            driverDoc.id;


          const card =
            document.createElement(
              "div"
            );


          const status =
            driver.status ||
            "available";


          card.className =
            "statusCard " +
            status;


          card.innerHTML = `

            <div class="statusName">
              🚕 ${escapeHtml(
                driver.name || "タクシー"
              )}
            </div>

            <div class="statusText">
              ${statusLabel(status)}
            </div>

            <div class="small">
              ${
                driver.updatedAt
                  ? "現在位置を約60秒ごとに更新"
                  : "位置情報取得待ち"
              }
            </div>

          `;


          list.appendChild(
            card
          );


          if(
            driver.latitude != null &&
            driver.longitude != null
          ){

            updateCustomerMarker(
              id,
              driver
            );

          }

        }
      );

    },

    error=>{

      console.error(
        "ドライバー監視エラー",
        error
      );

    }

  );

}


/* =====================================================
   ステータス表示
===================================================== */

function statusLabel(status){

  switch(status){

    case "available":
      return "🟢 空車";

    case "pickup":
      return "🟡 迎車中";

    case "arrived":
      return "🔵 到着";

    case "riding":
      return "🔴 乗車中";

    default:
      return "⚫ 休車";

  }

}


/* =====================================================
   配車送信
===================================================== */

window.callTaxi =
function(){

  clearError();


  const pickup =
    document
      .getElementById(
        "pickup"
      )
      .value.trim();


  const destination =
    document
      .getElementById(
        "destination"
      )
      .value.trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "お迎え先と目的地を入力してください🚕"
    );

    return;

  }


  document
    .getElementById(
      "showPickup"
    )
    .textContent =
      pickup;


  document
    .getElementById(
      "showDestination"
    )
    .textContent =
      destination;


  document
    .getElementById(
      "result"
    )
    .style.display =
      "block";

};


/* =====================================================
   配車確定
===================================================== */

window.confirmTaxi =
async function(){

  if(sendingRide){

    return;

  }


  clearError();


  const pickup =
    document
      .getElementById(
        "pickup"
      )
      .value.trim();


  const destination =
    document
      .getElementById(
        "destination"
      )
      .value.trim();


  if(
    !pickup ||
    !destination
  ){

    return;

  }


  sendingRide =
    true;


  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;


  button.textContent =
    "🚕 配車を送信中…";


  document
    .getElementById(
      "loadingBox"
    )
    .style.display =
      "block";


  try{

    const rideRef =
      await addDoc(

        collection(
          db,
          "rides"
        ),

        {

          pickup:
            pickup,

          destination:
            destination,

          status:
            "requested",

          acknowledgements:
            {},

          assignedDriverId:
            null,

          assignedDriverName:
            null,

          createdAt:
            serverTimestamp()

        }

      );


    currentCustomerRideId =
      rideRef.id;


    localStorage.setItem(
      "wolftaxi_customer_ride",
      rideRef.id
    );


    document
      .getElementById(
        "completePickup"
      )
      .textContent =
      pickup;


    document
      .getElementById(
        "completeDestination"
      )
      .textContent =
      destination;


    document
      .getElementById(
        "result"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "loadingBox"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "complete"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "customerRideInfo"
      )
      .style.display =
      "block";


    listenCustomerRide(
      rideRef.id
    );


  }
  catch(error){

    document
      .getElementById(
        "loadingBox"
      )
      .style.display =
      "none";


    showError(
      "配車の送信に失敗しました。\n" +
      getErrorMessage(error)
    );

  }


  sendingRide =
    false;


  button.disabled =
    false;


  button.textContent =
    "🚕 この内容で配車する";

};


/* =====================================================
   ドライバー配車監視
===================================================== */

function listenRides(){

  const q =
    query(
      collection(
        db,
        "rides"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  let firstSnapshot =
    true;


  const knownRides =
    new Set();


  onSnapshot(

    q,

    snapshot=>{

      const list =
        document.getElementById(
          "rideList"
        );


      list.innerHTML =
        "";


      if(snapshot.empty){

        list.innerHTML =
          '<div class="small">' +
          '現在、配車依頼はありません。' +
          '</div>';

        firstSnapshot =
          false;

        return;

      }


      snapshot.forEach(
        rideDoc=>{

            rideDoc.data();


          const rideId =
            rideDoc.id;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "ride";


          const acknowledgements =
            ride.acknowledgements ||
            {};


          const alreadyAcknowledged =
            !!acknowledgements[
              currentUser.uid
            ];

            ride.assignedDriverId;


          let buttons = "";


          /*
           * まだ誰も担当していない配車

            ride.status ===
            "requested"

            ){

            }

          }

            assigned &&

                  ride.assignedDriverName ||

          div.innerHTML = `

              🚕 配車
            </div>

            <div>
              📍 お迎え先
            </div>

            <strong>
              ${escapeHtml(
                ride.pickup || ""
              )}
            </strong>

            <br><br>

            <div>
              🏁 目的地
            </div>

            <strong>
              ${escapeHtml(
                ride.destination || ""
              )}
            </strong>

            <div class="ackList">

              <strong>
                👨‍✈️ 了解状況
              </strong>

              <div
                class="ackContainer"
              ></div>

            </div>

            ${buttons}

          `;


          list.appendChild(
            div
          );


          const ackContainer =
            div.querySelector(
              ".ackContainer"
            );


          /*
           * 了解した車両を全表示
           */

          Object.entries(
            acknowledgements
          ).forEach(
            ([uid,data])=>{

              const row =
                document.createElement(
                  "div"
                );


              row.className =
                "ackRow";


              if(
                uid ===
                assigned
              ){

                row.classList.add(
                  "assigned"
                );

                row.innerHTML =
                  "🟡 " +
                  escapeHtml(
                    data.name ||
                    "ドライバー"
                  ) +
                  "　了解済み";

              }
              else{

                row.innerHTML =
                  "🟢 " +
                  escapeHtml(
                    data.name ||
                    "ドライバー"
                  ) +
                  "　了解済み";

              }


              ackContainer.appendChild(
                row
              );

            }
          );


          if(
            Object.keys(
              acknowledgements
            ).length === 0
          ){

            ackContainer.innerHTML =
              '<div class="small">' +
              'まだ了解した車両はありません。' +
              '</div>';

          }


          /*
           * 担当車表示
           */

          if(assigned){

            const assignedRow =
              document.createElement(
                "div"
              );

            assignedRow.className =
              "ackRow assigned";


            assignedRow.innerHTML =
              "🚕 担当：" +
              escapeHtml(
                ride.assignedDriverName ||
                "ドライバー"
              );


            ackContainer.appendChild(
              assignedRow
            );

          }


          /*
           * ボタンイベント
           */

          const ackButton =
            div.querySelector(
              '[data-action="ack"]'
            );


          if(ackButton){

            ackButton.onclick =
              ()=>{
                acknowledgeRide(
                  rideId
                );
              };

          }


          const pickupButton =
            div.querySelector(
              '[data-action="pickup"]'
            );


          if(pickupButton){

            pickupButton.onclick =
              ()=>{
                startPickup(
                  rideId
                );
              };

          }


          const arrivedButton =
            div.querySelector(
              '[data-action="arrived"]'
            );


          if(arrivedButton){

            arrivedButton.onclick =
              ()=>{
                reportArrived(
                  rideId
                );
              };

          }


          const ridingButton =
            div.querySelector(
              '[data-action="riding"]'
            );


          if(ridingButton){

            ridingButton.onclick =
              ()=>{
                startRiding(
                  rideId,
                  ride.destination
                );
              };

          }


          const completeButton =
            div.querySelector(
              '[data-action="complete"]'
            );


          if(completeButton){

            completeButton.onclick =
              ()=>{
                completeRide(
                  rideId
                );
              };

          }


          /*
           * 新しい配車なら通知
           */

          if(

            !firstSnapshot &&

            ride.status ===
            "requested" &&

            !knownRides.has(
              rideId
            )

          ){

            startNotification(
              ride,
              rideId
            );

          }


          knownRides.add(
            rideId
          );

        }
      );


      firstSnapshot =
        false;

    },

    error=>{

      console.error(
        "配車監視エラー",
        error
      );

    }

  );

}


/* =====================================================
   配車を了解
   ★ ここで先着担当を自動決定
===================================================== */

async function acknowledgeRide(
  rideId
){

  try{

    const ref =
      doc(
        db,
        "rides",
        rideId
      );


    const result =
      await runTransaction(

        db,

        async transaction=>{

          const snap =
            await transaction.get(
              ref
            );


          if(!snap.exists()){

            throw new Error(
              "配車が見つかりません。"
            );

          }


          const ride =
            snap.data();


          const acknowledgements =
            {
              ...(ride.acknowledgements || {})
            };


          /*
           * すでに了解済みなら何もしない
           */

          if(
            acknowledgements[
              currentUser.uid
            ]
          ){

            return {
              already:true,
              assigned:
                ride.assignedDriverId ||
                null
            };

          }


          /*
           * 自分の了解を記録
           */

          acknowledgements[
            currentUser.uid
          ] = {

            name:
              driverName,

            at:
              serverTimestamp()

          };


          /*
           * まだ担当が決まっていなければ
           * 今回のドライバーを自動担当にする
           */

          if(
            !ride.assignedDriverId
          ){

            transaction.update(
              ref,
              {

                acknowledgements:
                  acknowledgements,

                assignedDriverId:
                  currentUser.uid,

                assignedDriverName:
                  driverName

              }
            );


            return {
              already:false,
              assigned:
                currentUser.uid,
              becameAssigned:true
            };

          }


          /*
           * すでに別のドライバーが担当なら
           * 了解だけ追加
           */

          transaction.update(
            ref,
            {

              acknowledgements:
                acknowledgements

            }
          );


          return {
            already:false,
            assigned:
              ride.assignedDriverId,
            becameAssigned:false
          };

        }

      );


    if(result.already){

      return;

    }


    if(
      result.becameAssigned
    ){

      alert(
        "🚕 了解しました！\n\n" +
        "あなたが担当車両になりました❤️"
      );

    }
    else{

      alert(
        "✅ 了解済みにしました❤️\n\n" +
        "担当は他のドライバーです。"
      );

    }

  }
  catch(error){

    alert(
      "了解処理に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

}

async function startPickup(

===================================================== */

async function completeRide(
  rideId
){

  try{

    const ref =
      doc(
        db,
        "rides",
        rideId
      );


    const snap =
      await getDoc(
        ref
      );


    if(!snap.exists()){

      await setDriverStatus(
        "available"
      );

      return;

    }


    const ride =
      snap.data();


    if(
      ride.assignedDriverId !==
      currentUser.uid
    ){

      throw new Error(
        "この配車の担当ではありません。"
      );

    }


    if(
      ride.status !==
      "riding"
    ){

      throw new Error(
        "現在の状態では完了できません。"
      );

    }


    /*
     * 完了時刻を保存してから削除
     */

    await updateDoc(
      ref,
      {

        status:
          "completed",

        completedAt:
          serverTimestamp()

      }
    );


    /*
     * 配車を削除
     */

    await deleteDoc(
      ref
    );


    /*
     * 車両を空車へ戻す
     */

    await setDriverStatus(
      "available"
    );


    alert(
      "✅ 配車完了❤️\n\n" +
      "空車に戻りました。"
    );

  }
  catch(error){

    alert(
      "完了処理に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

}

/* =====================================================
   GPS
   ★ 約60秒ごと
   ★ 空車でも更新
===================================================== */

function startGPS(){

  if(gpsStarted){

    return;

  }


  gpsStarted =
    true;


  if(
    !navigator.geolocation
  ){

    console.log(
      "GPS非対応"
    );

    return;

  }


  const updateLocation =
    ()=>{

      navigator.geolocation.getCurrentPosition(

        async position=>{

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          try{

            await updateDoc(

              doc(
                db,
                "drivers",
                currentUser.uid
              ),

              {

                latitude:
                  lat,

                longitude:
                  lng,

                updatedAt:
                  serverTimestamp()

              }

            );


            updateDriverMap(
              lat,
              lng
            );

          }
          catch(error){

            console.error(
              "GPS保存エラー",
              error
            );

          }

        },

        error=>{

          console.error(
            "GPS取得エラー",
            error
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            30000

        }

      );

    };


  /*
   * 起動時に即取得
   */

  updateLocation();


  /*
   * 約60秒ごと
   */

  setInterval(
    updateLocation,
    60000
  );

}

  lat,
  lng
){

  if(!driverMap){

    return;

  }


  if(!driverMarker){

    driverMarker =
      L.marker(
        [lat,lng]
      ).addTo(
        driverMap
      );

    driverMarker.bindPopup(
      "🚕 " +
      driverName
    );

  }
  else{

    driverMarker.setLatLng(
      [lat,lng]
    );

  }


  driverMap.setView(
    [lat,lng],
    15
  );

}

/* =====================================================
   お客さん側配車表示
===================================================== */

function updateCustomerRideDisplay(
  ride
){

  const status =
    ride.status ||
    "requested";


  let text =
    "";


  switch(status){

    case "requested":

      if(
        ride.assignedDriverName
      ){

        text =
          "🚕 " +
          ride.assignedDriverName +
          " が担当になりました。迎車準備中です。";

      }
      else{

        text =
          "🚕 配車依頼を送信しました。\n" +
          "ドライバーの了解を待っています。";

      }

      break;


    case "pickup":

      text =
        "🟡 " +
        (ride.assignedDriverName || "タクシー") +
        " が迎車中です。";

      break;


    case "arrived":

      text =
        "🔵 " +
        (ride.assignedDriverName || "タクシー") +
        " が到着しました。";

      break;


    case "riding":

      text =
        "🔴 ただいま乗車中です。";

      break;


    default:

      text =
        "🚕 配車処理中です。";

  }


  document
    .getElementById(
      "customerQueueText"
    )
    .textContent =
      text;


  /*
   * 了解状況を作り直す
   */

  renderCustomerAcknowledgements(
    ride
  );


  /*
   * 担当車両だけGPS監視
   */

  if(
    ride.assignedDriverId
  ){

    listenAssignedDriverLocation(
      ride.assignedDriverId
    );

  }
  else{

    stopAssignedDriverListeners();

  }

}

  )

      ){

      drivers.forEach(

            document.createElement(

          row.className =

                ) +

                "🚕 この車両が担当" +

                "🟢 " +
                escapeHtml(
                  driver.name
                ) +

              "pending"
            );

            row.innerHTML =
              "⚪ " +
              escapeHtml(
                driver.name
              ) +
              "　未了解";

          }


          ackList.appendChild(
            row
          );

        }
      );

    }
  )
  .catch(
    error=>{

      console.error(
        "了解状況取得エラー",
        error
      );

    }
  );

}


/* =====================================================
   全ドライバー取得
===================================================== */

async function getDriversForAcknowledgement(
  acknowledgements,
  assignedDriverId
){

  /*
   * 現在のdrivers一覧を
   * 1回取得する。
   *
   * 既存のlistenDrivers()とは別に
   * 配車確認表示用として使用。
   */

  const snapshot =
    await new Promise(
      (resolve,reject)=>{

        const q =
          query(
            collection(
              db,
              "drivers"
            )
          );


        /*
         * 一度だけ取得するため
         * onSnapshotを解除する。
         */

        let unsubscribe =
          null;


        unsubscribe =
          onSnapshot(

            q,

            snap=>{

              if(unsubscribe){

                unsubscribe();

              }

              resolve(snap);

            },

            error=>{

              if(unsubscribe){

                unsubscribe();

              }

              reject(error);

            }

          );

      }
    );


  const drivers =
    [];


  snapshot.forEach(
    driverDoc=>{

      const data =
        driverDoc.data();


      drivers.push({

        id:
          driverDoc.id,

        name:
          data.name ||
          "タクシー",

        status:
          data.status ||
          "available"

      });

    }
  );


  /*
   * 名前順で安定表示
   */

  drivers.sort(
    (a,b)=>
      String(a.name)
        .localeCompare(
          String(b.name),
          "ja"
        )
  );


  return drivers;

}


/* =====================================================
   担当車両の位置
===================================================== */

function listenAssignedDriverLocation(
  driverId
){

  if(!customerRideMap){

    initCustomerRideMap();

  }


  /*
   * 同じ車両を二重監視しない
   */

  if(
    assignedDriverUnsubscribes[
      driverId
    ]
  ){

    return;

  }


  assignedDriverUnsubscribes[
    driverId
  ] =
    onSnapshot(

      doc(
        db,
        "drivers",
        driverId
      ),

      snapshot=>{

        if(!snapshot.exists()){

          return;

        }


        const driver =
          snapshot.data();


        if(
          driver.latitude == null ||
          driver.longitude == null
        ){

          return;

        }


        const lat =
          driver.latitude;

        const lng =
          driver.longitude;


        if(
          !customerRideMarkers[
            driverId
          ]
        ){

          customerRideMarkers[
            driverId
          ] =
            L.marker(
              [lat,lng]
            ).addTo(
              customerRideMap
            );


          customerRideMarkers[
            driverId
          ].bindPopup(
            "🚕 " +
            (driver.name || "担当車")
          );

        }
        else{

          customerRideMarkers[
            driverId
          ].setLatLng(
            [lat,lng]
          );

        }


        customerRideMap.setView(
          [lat,lng],
          15
        );

      },

      error=>{

        console.error(
          "担当車GPS監視エラー",
          error
        );

      }

    );

}


/* =====================================================
   担当車GPS監視停止
===================================================== */

function stopAssignedDriverListeners(){

  Object.values(
    assignedDriverUnsubscribes
  )
  .forEach(
    unsubscribe=>{

      try{

        unsubscribe();

      }
      catch(error){

        console.error(
          error
        );

      }

    }
  );


  assignedDriverUnsubscribes =
    {};


  Object.values(
    customerRideMarkers
  )
  .forEach(
    marker=>{

      if(customerRideMap){

        customerRideMap.removeLayer(
          marker
        );

      }

    }
  );


  customerRideMarkers =
    {};

}


/* =====================================================
   配車用地図
===================================================== */

function initCustomerRideMap(){

  if(customerRideMap){

    return;

  }


  customerRideMap =
    L.map(
      "customerRideMap"
    ).setView(
      HACHIJO,
      12
    );


  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom:
        19,

      attribution:
        '&copy; OpenStreetMap contributors'

    }

  ).addTo(
    customerRideMap
  );

}


/* =====================================================
   通知音
===================================================== */

function getSoundFile(
  ride
){

  const pickup =
    (
      ride.pickup ||
      ""
    ).trim();


  const destination =
    (
      ride.destination ||
      ""
    ).trim();


  if(
    pickup.includes(
      "ザイオン"
    )
  ){

    return sounds.zaion;

  }


  if(
    destination.includes(
      "成田"
    )
  ){

    return sounds.narita;

  }


  if(
    destination.includes(
      "羽田"
    )
  ){

    return sounds.haneda;

  }


  return sounds.normal;

}


/* =====================================================
   通知開始
   ★ 30秒で停止
===================================================== */

function startNotification(
  ride,
  rideId
){

  if(!notificationEnabled){

    showNotice(
      ride
    );

    return;

  }


  if(
    notificationRunning &&
    notificationRideId ===
    rideId
  ){

    return;

  }


  stopNotificationSound();


  notificationRunning =
    true;

  notificationRideId =
    rideId;


  showNotice(
    ride
  );


  /*
   * 最初の通知
   */

  playNotificationSound(
    ride
  );


  speakTaxi();


  /*
   * 音声読み上げは
   * 7秒ごとに再生
   */

  speechTimer =
    setInterval(

      ()=>{

        if(
          notificationRunning
        ){

          speakTaxi();

        }

      },

      7000

    );


  /*
   * 30秒で完全停止
   */

  notificationStopTimer =
    setTimeout(

      ()=>{

        stopNotificationSound();

      },

      30000

    );

}


/* =====================================================
   音声再生
   ★ 音声終了 → 2秒 → 再生
===================================================== */

function playNotificationSound(
  ride
){

  if(!notificationEnabled){

    return;

  }


  if(!notificationRunning){

    return;

  }


  try{

    if(currentAudio){

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }


    if(notificationNextSoundTimer){

      clearTimeout(
        notificationNextSoundTimer
      );

      notificationNextSoundTimer =
        null;

    }


    currentAudio =
      new Audio(
        getSoundFile(
          ride
        )
      );


    currentAudio.volume =
      1;


    currentAudio.onended =
      ()=>{

        if(
          !notificationRunning
        ){

          return;

        }


        /*
         * 音声ファイルが完全に終わってから
         * 2秒待つ
         */

        notificationNextSoundTimer =
          setTimeout(

            ()=>{

              if(
                notificationRunning
              ){

                playNotificationSound(
                  ride
                );

              }

            },

            2000

          );

      };


    currentAudio.play()
      .catch(
        error=>{

          console.error(
            "通知音エラー",
            error
          );

        }
      );

  }
  catch(error){

    console.error(
      "通知音再生エラー",
      error
    );

  }

}


/* =====================================================
   音声読み上げ
===================================================== */

function speakTaxi(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  if(!notificationRunning){

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      "配車です。配車です。了解ボタンを押してください。"
    );


  utterance.lang =
    "ja-JP";

  utterance.rate =
    1;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}


/* =====================================================
   通知画面
===================================================== */

function showNotice(
  ride
){

  document
    .getElementById(
      "noticePickup"
    )
    .textContent =
      "📍 お迎え先：" +
      ride.pickup;


  document
    .getElementById(
      "noticeDestination"
    )
    .textContent =
      "🏁 目的地：" +
      ride.destination;


  document
    .getElementById(
      "notice"
    )
    .style.display =
      "block";

}


/* =====================================================
   通知画面だけ閉じる
===================================================== */

window.closeNoticeOnly =
function(){

  document
    .getElementById(
      "notice"
    )
    .style.display =
      "none";

};


/* =====================================================
   通知停止
===================================================== */

function stopNotificationSound(){

  notificationRunning =
    false;


  notificationRideId =
    null;


  if(notificationNextSoundTimer){

    clearTimeout(
      notificationNextSoundTimer
    );

    notificationNextSoundTimer =
      null;

  }


  if(speechTimer){

    clearInterval(
      speechTimer
    );

    speechTimer =
      null;

  }


  if(notificationStopTimer){

    clearTimeout(
      notificationStopTimer
    );

    notificationStopTimer =
      null;

  }


  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime =
      0;

    currentAudio.onended =
      null;

    currentAudio =
      null;

  }


  if(
    "speechSynthesis"
    in window
  ){

    window.speechSynthesis.cancel();

  }

}


/* =====================================================
   通知ON
===================================================== */

window.enableNotification =
function(){

  notificationEnabled =
    true;


  try{

    const audio =
      new Audio(
        sounds.normal
      );


    audio.volume =
      0;


    audio.play()
      .then(
        ()=>{

          audio.pause();

          audio.currentTime =
            0;

        }
      )
      .catch(
        error=>{

          console.log(
            "音声許可確認",
            error
          );

        }
      );

  }
  catch(error){

    console.error(
      error
    );

  }


  document
    .getElementById(
      "soundButton"
    )
    .textContent =
      "🔔 配車通知ON";


  document
    .getElementById(
      "soundStatus"
    )
    .textContent =
      "🔔 配車通知がONになっています";

};


/* =====================================================
   Google Mapsナビ起動
===================================================== */

function openNavigation(
  destination
){

  if(!destination){

    return;

  }


  const encoded =
    encodeURIComponent(
      destination
    );


  const url =
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encoded +
    "&travelmode=driving";


  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   エラー
===================================================== */

function showError(
  message
){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    "❌ " +
    message;


  box.style.display =
    "block";

}


function clearError(){

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    "";


  box.style.display =
    "none";

}


function getErrorMessage(
  error
){

  if(!error){

    return "原因不明のエラーです。";

  }


  return (
    error.code
      ? error.code + "\n"
      : ""
  ) +
  (
    error.message ||
    String(error)
  );

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(
  text
){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


/* =====================================================
   起動
===================================================== */

start();
