<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WOLFtaxi</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
  color:#333;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  margin-top:5px;
  opacity:.8;
}

.card{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:5px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.confirm{
  background:#e60023;
}

.driver{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

#result{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f1f1f1;
  border-radius:12px;
}

#complete{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fff0f2;
  border-radius:12px;
  text-align:center;
}

#complete h2{
  color:#e60023;
}

#driverScreen{
  display:none;
}

.notifyOn{
  background:#087f23;
}

#soundStatus{
  font-weight:bold;
}

.busy{
  margin-top:15px;
  padding:14px;
  background:#fff4d6;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  color:#8a5a00;
}

.ride{
  border:2px solid #e60023;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:white;
}

.ride button{
  background:#111;
}

.status{
  font-weight:bold;
  color:#e60023;
  font-size:18px;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

.notice{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:#e60023;
  color:white;
  padding:30px 20px;
  text-align:center;
  animation:blink .8s infinite;
}

.notice h1{
  font-size:44px;
  margin:20px 0;
}

.notice p{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.notice .noticeBox{
  background:white;
  color:#222;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.notice button{
  background:white;
  color:#e60023;
  margin-top:25px;
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.82;
  }
}

.flash{
  animation:flashScreen .5s infinite alternate;
}

@keyframes flashScreen{
  from{
    box-shadow:inset 0 0 0 0 rgba(230,0,35,0);
  }
  to{
    box-shadow:inset 0 0 0 8px rgba(230,0,35,.5);
  }
}
</style>
</head>

<body>

<div class="header">
  🚕 WOLFtaxi
  <div class="sub">かんたんタクシー配車</div>
</div>


<!-- ========================= -->
<!-- お客様画面 -->
<!-- ========================= -->

<div class="card" id="customerScreen">

  <h2>📍 お迎え先</h2>

  <input
    id="pickup"
    type="text"
    placeholder="お迎え先を入力"
  >

  <h2>🏁 目的地</h2>

  <input
    id="destination"
    type="text"
    placeholder="目的地を入力"
  >

  <button onclick="callTaxi()">
    🚕 タクシーを呼ぶ
  </button>


  <!-- 確認画面 -->

  <div id="result">

    <h2>🚕 配車内容</h2>

    <p>📍 お迎え先</p>
    <p id="showPickup"></p>

    <p>🏁 目的地</p>
    <p id="showDestination"></p>

    <button
      id="confirmButton"
      class="confirm"
      onclick="confirmTaxi()"
    >
      ✅ この内容で配車する
    </button>

  </div>


  <!-- 受付完了 -->

  <div id="complete">

    <h2>🚕 配車を受け付けました</h2>

    <p>
      ドライバー001がお迎えにあがります。
    </p>

    <p>📍 お迎え先</p>
    <p id="completePickup"></p>

    <p>🏁 目的地</p>
    <p id="completeDestination"></p>

  </div>


  <div class="driver">
    ドライバー　001
  </div>

</div>



<!-- ========================= -->
<!-- ドライバー画面 -->
<!-- ========================= -->

<div class="card" id="driverScreen">

  <h2>🚕 ドライバー画面</h2>

  <div class="driver">
    ドライバー　001
  </div>


  <button
    id="soundButton"
    class="notifyOn"
    onclick="enableNotification()"
  >
    🔔 配車通知をON
  </button>


  <p
    id="soundStatus"
    class="driver"
  >
    配車通知をONにしてください
  </p>


  <div
    id="busyMessage"
    class="busy"
    style="display:none;"
  >
  </div>


  <hr>


  <div id="rideList">

    <div class="empty">
      配車を待っています…
    </div>

  </div>

</div>



<!-- ========================= -->
<!-- 配車通知画面 -->
<!-- ========================= -->

<div id="notice" class="notice">

  <div style="font-size:60px;">
    🚕
  </div>

  <h1>
    配車です！
  </h1>

  <div class="noticeBox">

    <p id="noticePickup"></p>

    <p id="noticeDestination"></p>

  </div>


  <button onclick="stopNotification()">
    🔕 確認しました
  </button>

</div>



<script type="module">

/* =========================================
   Firebase
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   Firebase設定
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",

  authDomain:
    "wolftaxi-53314.firebaseapp.com",

  projectId:
    "wolftaxi-53314",

  storageBucket:
    "wolftaxi-53314.firebasestorage.app",

  messagingSenderId:
    "409259660325",

  appId:
    "1:409259660325:web:3506611653a617cccbdbcc",

  measurementId:
    "G-SX3VMEZJ92"

};


/* =========================================
   Firebase起動
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* =========================================
   通知関係
========================================= */

let audioContext = null;

let soundTimer = null;

let soundEndTimer = null;

let notificationEnabled = false;

let notificationRunning = false;



/* =========================================
   電子音
========================================= */

function playBeep(){

  if(!notificationEnabled){
    return;
  }

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }


    const now =
      audioContext.currentTime;


    const osc1 =
      audioContext.createOscillator();

    const osc2 =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    /*
      WOLFtaxi専用の
      電子呼び出し音
    */

    osc1.frequency.setValueAtTime(
      880,
      now
    );

    osc1.frequency.setValueAtTime(
      1320,
      now + .12
    );


    osc2.frequency.setValueAtTime(
      660,
      now
    );

    osc2.frequency.setValueAtTime(
      990,
      now + .12
    );


    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .25,
      now + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .38
    );


    osc1.connect(gain);

    osc2.connect(gain);

    gain.connect(
      audioContext.destination
    );


    osc1.start(now);

    osc2.start(now);


    osc1.stop(
      now + .42
    );

    osc2.stop(
      now + .42
    );

  }
  catch(error){

    console.error(
      "通知音エラー",
      error
    );

  }

}



/* =========================================
   通知ON
========================================= */

window.enableNotification =
function(){

  notificationEnabled = true;


  try{

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioContext.resume();


    /*
      ボタンを押した瞬間に
      音を鳴らしてブラウザの
      音声再生許可を取得
    */

    playBeep();

  }
  catch(error){

    console.error(error);

  }


  document
    .getElementById("soundButton")
    .textContent =
      "🔔 配車通知ON";


  document
    .getElementById("soundStatus")
    .textContent =
      "🔔 配車通知がONになっています";

};



/* =========================================
   音声読み上げ
========================================= */

function speakTaxi(){

  try{

    if(
      !("speechSynthesis" in window)
    ){
      return;
    }


    window.speechSynthesis.cancel();


    const message =
      new SpeechSynthesisUtterance(
        "配車です"
      );


    message.lang =
      "ja-JP";

    message.rate =
      1.0;

    message.pitch =
      1.0;

    message.volume =
      1.0;


    window.speechSynthesis.speak(
      message
    );

  }
  catch(error){

    console.error(
      "音声エラー",
      error
    );

  }

}



/* =========================================
   通知開始
========================================= */

function startNotification(ride){

  if(!notificationEnabled){

    /*
      通知ON前でも画面表示はする
    */

    showNotice(ride);

    return;

  }


  if(notificationRunning){

    /*
      すでに通知中なら
      画面を新しい配車に更新するだけ
    */

    showNotice(ride);

    return;

  }


  notificationRunning = true;


  showNotice(ride);


  stopSound();


  /*
    音声
  */

  speakTaxi();


  /*
    電子音
  */

  playBeep();


  soundTimer =
    setInterval(
      playBeep,
      1200
    );


  /*
    最大15秒
  */

  soundEndTimer =
    setTimeout(
      stopSound,
      15000
    );

}



/* =========================================
   通知画面表示
========================================= */

function showNotice(ride){

  const notice =
    document.getElementById(
      "notice"
    );


  document
    .getElementById(
      "noticePickup"
    )
    .textContent =
      "📍 " +
      (ride.pickup || "");


  document
    .getElementById(
      "noticeDestination"
    )
    .textContent =
      "🏁 " +
      (ride.destination || "");


  notice.style.display =
    "block";


  document.body.classList.add(
    "flash"
  );

}



/* =========================================
   通知停止
========================================= */

function stopSound(){

  if(soundTimer){

    clearInterval(
      soundTimer
    );

    soundTimer = null;

  }


  if(soundEndTimer){

    clearTimeout(
      soundEndTimer
    );

    soundEndTimer = null;

  }

}



/* =========================================
   通知確認
========================================= */

window.stopNotification =
function(){

  stopSound();


  notificationRunning =
    false;


  if(
    "speechSynthesis"
    in window
  ){

    window.speechSynthesis.cancel();

  }


  document
    .getElementById("notice")
    .style.display =
      "none";


  document.body.classList.remove(
    "flash"
  );

};



/* =========================================
   Firebase匿名ログイン
========================================= */

signInAnonymously(auth)

.then(()=>{

  console.log(
    "Firebase認証OK"
  );


  startDriverMode();

})

.catch(error=>{

  console.error(error);


  alert(
    "Firebaseへの接続に失敗しました"
  );

});



/* =========================================
   お客様画面
========================================= */

window.callTaxi =
function(){

  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();


  const destination =
    document
      .getElementById("destination")
      .value
      .trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "お迎え先と目的地を入力してください🚕"
    );

    return;

  }


  document
    .getElementById(
      "showPickup"
    )
    .textContent =
      pickup;


  document
    .getElementById(
      "showDestination"
    )
    .textContent =
      destination;


  document
    .getElementById(
      "result"
    )
    .style.display =
      "block";

};



/* =========================================
   配車送信
========================================= */

let sendingRide =
  false;


window.confirmTaxi =
async function(){

  if(sendingRide){
    return;
  }


  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();


  const destination =
    document
      .getElementById("destination")
      .value
      .trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "入力内容を確認してください"
    );

    return;

  }


  sendingRide =
    true;


  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;


  button.textContent =
    "🚕 配車を送信中…";


  try{

    await addDoc(

      collection(
        db,
        "rides"
      ),

      {

        pickup:
          pickup,

        destination:
          destination,

        driver:
          "001",

        status:
          "requested",

        createdAt:
          serverTimestamp()

      }

    );


    document
      .getElementById(
        "completePickup"
      )
      .textContent =
        pickup;


    document
      .getElementById(
        "completeDestination"
      )
      .textContent =
        destination;


    document
      .getElementById(
        "result"
      )
      .style.display =
        "none";


    document
      .getElementById(
        "complete"
      )
      .style.display =
        "block";


    document
      .getElementById(
        "pickup"
      )
      .value =
        "";


    document
      .getElementById(
        "destination"
      )
      .value =
        "";


  }
  catch(error){

    console.error(error);


    sendingRide =
      false;


    button.disabled =
      false;


    button.textContent =
      "✅ この内容で配車する";


    alert(
      "配車の送信に失敗しました。\n" +
      error.message
    );

  }

};



/* =========================================
   ドライバー画面
========================================= */

function startDriverMode(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
    ?driver=001
  */

  if(
    params.get("driver") !==
    "001"
  ){

    return;

  }


  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "block";


  const ridesQuery =
    query(

      collection(
        db,
        "rides"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );


  let firstSnapshot =
    true;


  const knownRides =
    new Set();


  onSnapshot(

    ridesQuery,

    snapshot=>{

      const list =
        document.getElementById(
          "rideList"
        );


      const busyMessage =
        document.getElementById(
          "busyMessage"
        );


      /*
        配車件数
      */

      const rideCount =
        snapshot.size;


      if(rideCount > 0){

        busyMessage.style.display =
          "block";


        busyMessage.textContent =
          "🚕 ただいま別の方の配車依頼対応中（" +
          rideCount +
          "件）";

      }
      else{

        busyMessage.style.display =
          "none";

      }


      /*
        配車なし
      */

      if(snapshot.empty){

        list.innerHTML =
          '<div class="empty">' +
          '現在、配車依頼はありません。' +
          '</div>';

        return;

      }


      list.innerHTML =
        "";


      snapshot.forEach(
        doc=>{

          const ride =
            doc.data();


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "ride";


          div.innerHTML = `

            <div class="status">
              🚕 新しい配車
            </div>

            <div>
              📍 お迎え先
            </div>

            <strong>
              ${escapeHtml(
                ride.pickup || ""
              )}
            </strong>

            <br><br>

            <div>
              🏁 目的地
            </div>

            <strong>
              ${escapeHtml(
                ride.destination || ""
              )}
            </strong>

            <br><br>

            <div>
              👨‍✈️ ドライバー：001
            </div>

          `;


          list.appendChild(
            div
          );


          /*
            新規配車だけ通知
          */

          if(

            !firstSnapshot &&

            ride.status ===
            "requested" &&

            !knownRides.has(
              doc.id
            )

          ){

            startNotification(
              ride
            );

          }


          knownRides.add(
            doc.id
          );

        }
      );


      firstSnapshot =
        false;

    },

    error=>{

      console.error(
        error
      );


      document
        .getElementById(
          "rideList"
        )
        .textContent =
          "配車情報の読み込みに失敗しました。";

    }

  );

}



/* =========================================
   安全なHTML表示
========================================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}

</script>

</body>
</html>
