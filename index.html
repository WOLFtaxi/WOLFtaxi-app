<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WOLFtaxi</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
  color:#333;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  margin-top:5px;
  opacity:.8;
}

.card{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h2{margin-top:0}

input{
  width:100%;
  padding:15px;
  margin:8px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:5px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.confirm{
  background:#e60023;
}

.driver{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

#result{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f1f1f1;
  border-radius:12px;
}

#complete{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fff0f2;
  border-radius:12px;
  text-align:center;
}

#complete h2{
  color:#e60023;
}

#driverScreen{
  display:none;
}

.notice{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:#e60023;
  color:white;
  padding:30px 20px;
  text-align:center;
  animation:blink 1s infinite;
}

.notice h1{
  font-size:42px;
  margin:20px 0;
}

.notice p{
  font-size:24px;
  font-weight:bold;
}

.notice button{
  background:white;
  color:#e60023;
  margin-top:30px;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.82}
}

.notifyOn{
  background:#087f23;
}

.ride{
  border:2px solid #e60023;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:white;
}

.ride button{
  background:#111;
}

.status{
  font-weight:bold;
  color:#e60023;
  font-size:18px;
  margin-bottom:12px;
}

.accepted{
  border-color:#087f23;
}

.accepted .status{
  color:#087f23;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  🚕 WOLFtaxi
  <div class="sub">かんたんタクシー配車</div>
</div>

<!-- お客様画面 -->
<div class="card" id="customerScreen">

  <h2>📍 お迎え先</h2>
  <input id="pickup" type="text" placeholder="お迎え先を入力">

  <h2>🏁 目的地</h2>
  <input id="destination" type="text" placeholder="目的地を入力">

  <button onclick="callTaxi()">
    🚕 タクシーを呼ぶ
  </button>

  <div id="result">

    <h2>🚕 配車内容</h2>

    <p>📍 お迎え先</p>
    <p id="showPickup"></p>

    <p>🏁 目的地</p>
    <p id="showDestination"></p>

    <button
      id="confirmButton"
      class="confirm"
      onclick="confirmTaxi()">
      ✅ この内容で配車する
    </button>

  </div>

  <div id="complete">

    <h2>🚕 配車を受け付けました</h2>

    <p>ドライバー001がお迎えにあがります。</p>

    <p>📍 お迎え先</p>
    <p id="completePickup"></p>

    <p>🏁 目的地</p>
    <p id="completeDestination"></p>

  </div>

  <div class="driver">
    ドライバー　001
  </div>

</div>


<!-- ドライバー画面 -->
<div class="card" id="driverScreen">

  <h2>🚕 ドライバー画面</h2>

  <div class="driver">
    ドライバー　001
  </div>

  <button
    id="soundButton"
    class="notifyOn"
    onclick="enableNotification()">
    🔔 配車通知をON
  </button>

  <p id="soundStatus" class="driver">
    配車通知をONにしてください
  </p>

  <hr>

  <div id="rideList">
    <div class="empty">
      配車を待っています…
    </div>
  </div>

</div>


<!-- 配車通知 -->
<div id="notice" class="notice">

  <div>🚕</div>

  <h1>配車です！</h1>

  <p id="noticePickup"></p>
  <p id="noticeDestination"></p>

  <button onclick="stopNotification()">
    🔕 確認しました
  </button>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:"AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",

  authDomain:
    "wolftaxi-53314.firebaseapp.com",

  projectId:
    "wolftaxi-53314",

  storageBucket:
    "wolftaxi-53314.firebasestorage.app",

  messagingSenderId:
    "409259660325",

  appId:
    "1:409259660325:web:3506611653a617cccbdbcc",

  measurementId:
    "G-SX3VMEZJ92"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* 通知音 */

let audioContext=null;
let soundTimer=null;
let soundEndTimer=null;
let notificationEnabled=false;


function playBeep(){

  if(!notificationEnabled)return;

  try{

    if(!audioContext){
      audioContext=
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }

    if(audioContext.state==="suspended"){
      audioContext.resume();
    }

    const now=audioContext.currentTime;

    const osc1=audioContext.createOscillator();
    const osc2=audioContext.createOscillator();

    const gain=audioContext.createGain();

    osc1.frequency.setValueAtTime(880,now);
    osc1.frequency.setValueAtTime(1320,now+.12);

    osc2.frequency.setValueAtTime(660,now);
    osc2.frequency.setValueAtTime(990,now+.12);

    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.25,now+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.35);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioContext.destination);

    osc1.start(now);
    osc2.start(now);

    osc1.stop(now+.4);
    osc2.stop(now+.4);

  }catch(error){

    console.error("通知音エラー",error);

  }

}


/* 通知音ON */

window.enableNotification=function(){

  notificationEnabled=true;

  try{

    audioContext=
      new (window.AudioContext ||
      window.webkitAudioContext)();

    audioContext.resume();

    playBeep();

  }catch(error){

    console.error(error);

  }

  document.getElementById("soundButton")
    .textContent="🔔 配車通知ON";

  document.getElementById("soundStatus")
    .textContent="🔔 配車通知がONになっています";

};


/* 通知開始 */

function startNotification(ride){

  document.getElementById("noticePickup")
    .textContent="📍 "+(ride.pickup||"");

  document.getElementById("noticeDestination")
    .textContent="🏁 "+(ride.destination||"");

  document.getElementById("notice")
    .style.display="block";

  stopSound();

  playBeep();

  soundTimer=setInterval(
    playBeep,
    1400
  );

  soundEndTimer=setTimeout(
    stopSound,
    15000
  );

}


/* 通知停止 */

function stopSound(){

  if(soundTimer){
    clearInterval(soundTimer);
    soundTimer=null;
  }

  if(soundEndTimer){
    clearTimeout(soundEndTimer);
    soundEndTimer=null;
  }

}


window.stopNotification=function(){

  stopSound();

  document.getElementById("notice")
    .style.display="none";

};


/* Firebase匿名ログイン */

signInAnonymously(auth)
.then(()=>{

  console.log("Firebase認証OK");

  startDriverMode();

})
.catch(error=>{

  console.error(error);

  alert("Firebaseへの接続に失敗しました");

});


/* お客様：確認画面 */

window.callTaxi=function(){

  const pickup=
    document.getElementById("pickup")
    .value.trim();

  const destination=
    document.getElementById("destination")
    .value.trim();

  if(!pickup || !destination){

    alert(
      "お迎え先と目的地を入力してください🚕"
    );

    return;
  }

  document.getElementById("showPickup")
    .textContent=pickup;

  document.getElementById("showDestination")
    .textContent=destination;

  document.getElementById("result")
    .style.display="block";

};


/* お客様：配車確定 */

let sendingRide=false;

window.confirmTaxi=async function(){

  if(sendingRide)return;

  const pickup=
    document.getElementById("pickup")
    .value.trim();

  const destination=
    document.getElementById("destination")
    .value.trim();

  if(!pickup || !destination){

    alert("入力内容を確認してください");

    return;
  }

  sendingRide=true;

  const button=
    document.getElementById("confirmButton");

  button.disabled=true;
  button.textContent="🚕 配車を送信中…";

  try{

    await addDoc(
      collection(db,"rides"),
      {
        pickup:pickup,
        destination:destination,
        driver:"001",
        status:"requested",
        createdAt:serverTimestamp()
      }
    );

    document.getElementById("completePickup")
      .textContent=pickup;

    document.getElementById("completeDestination")
      .textContent=destination;

    document.getElementById("result")
      .style.display="none";

    document.getElementById("complete")
      .style.display="block";

    document.getElementById("pickup")
      .value="";

    document.getElementById("destination")
      .value="";

  }catch(error){

    console.error(error);

    sendingRide=false;

    button.disabled=false;

    button.textContent=
      "✅ この内容で配車する";

    alert(
      "配車の送信に失敗しました。\n"+
      error.message
    );

  }

};


/* ドライバー画面 */

function startDriverMode(){

  const params=
    new URLSearchParams(
      window.location.search
    );

  if(params.get("driver")!=="001"){
    return;
  }

  document.getElementById("customerScreen")
    .style.display="none";

  document.getElementById("driverScreen")
    .style.display="block";


  const ridesQuery=
    query(
      collection(db,"rides"),
      orderBy("createdAt","desc")
    );


  let firstSnapshot=true;
  let knownRides=new Set();


  onSnapshot(
    ridesQuery,

    snapshot=>{

      const list=
        document.getElementById("rideList");

      if(snapshot.empty){

        list.innerHTML=
          '<div class="empty">'+
          '現在、配車依頼はありません。'+
          '</div>';

        return;
      }


      list.innerHTML="";


      snapshot.forEach(doc=>{

        const ride=doc.data();

        const div=
          document.createElement("div");

        div.className="ride";

        if(ride.status==="accepted"){
          div.classList.add("accepted");
        }


        const statusText=
          ride.status==="accepted"
          ? "✅ 対応中"
          : "🚕 新しい配車";


        div.innerHTML=`

          <div class="status">
            ${statusText}
          </div>

          <div>📍 お迎え先</div>

          <strong>
            ${escapeHtml(ride.pickup||"")}
          </strong>

          <br><br>

          <div>🏁 目的地</div>

          <strong>
            ${escapeHtml(ride.destination||"")}
          </strong>

          <br><br>

          <div>
            👨‍✈️ ドライバー：001
          </div>

        `;


        list.appendChild(div);


        if(
          !firstSnapshot &&
          ride.status==="requested" &&
          !knownRides.has(doc.id)
        ){

          startNotification(ride);

        }

        knownRides.add(doc.id);

      });


      firstSnapshot=false;

    },

    error=>{

      console.error(error);

      document.getElementById("rideList")
        .textContent=
        "配車情報の読み込みに失敗しました。";

    }

  );

}


/* 表示用安全処理 */

function escapeHtml(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

</script>

</body>
</html>
