<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WOLFtaxi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f7f7f7;color:#333}
.header{background:#111;color:#fff;padding:20px;text-align:center;font-size:28px;font-weight:bold}.sub{font-size:14px;margin-top:5px;opacity:.8}
.card{background:#fff;margin:15px;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
h2{margin-top:0}input{width:100%;padding:15px;margin:8px 0 20px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:16px;margin-top:7px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:bold}
button:disabled{opacity:.55}.confirm{background:#e60023}.green{background:#087f23}.blue{background:#174ea6}.orange{background:#d97700}.gray{background:#666}
#customerScreen,#driverScreen,#driverRegistration{display:none}
.infoBox{padding:14px;border-radius:12px;background:#eef5ff;color:#174ea6;margin:12px 0}
.statusCard{padding:14px;margin:10px 0;border-radius:14px;background:#f5f5f5;border-left:7px solid #777}.statusCard.available{border-left-color:#087f23}.statusCard.pickup{border-left-color:#d97700}.statusCard.arrived{border-left-color:#174ea6}.statusCard.riding{border-left-color:#e60023}
.statusName{font-size:19px;font-weight:bold}.statusText{font-weight:bold;margin-top:5px}.small{font-size:13px;color:#777;margin-top:5px}
.ride{border:2px solid #e60023;border-radius:14px;padding:15px;margin-top:15px;background:#fff}.rideTitle{color:#e60023;font-weight:bold;font-size:19px;margin-bottom:15px}
.ackList{background:#f5f5f5;border-radius:12px;padding:12px;margin:12px 0}.ackRow{padding:6px 0}.assigned{color:#d97700;font-weight:bold}
.map{width:100%;height:280px;border-radius:15px;margin-top:15px;overflow:hidden}#driverMap{height:300px}
.registration{text-align:center}.registration p{color:#666}
.notice{display:none;position:fixed;z-index:9999;inset:0;background:#e60023;color:#fff;padding:25px 20px;text-align:center}
.notice h1{font-size:42px;margin:15px 0}.noticeBox{background:#fff;color:#222;border-radius:18px;padding:20px;margin-top:20px}.notice button{background:#fff;color:#e60023;margin-top:25px}
.queueBox{padding:16px;background:#fff4d6;color:#8a5a00;border-radius:12px;text-align:center;font-weight:bold;margin-top:15px}
.chatBox{margin-top:15px}.chatMessages{max-height:220px;overflow:auto;background:#f5f5f5;border-radius:12px;padding:10px}.chatMsg{padding:8px;border-bottom:1px solid #ddd}.chatMeta{font-size:12px;color:#777}.chatInput{display:flex;gap:8px}.chatInput input{margin:8px 0;flex:1}.chatInput button{width:100px;margin:8px 0;padding:10px}.time{font-size:13px;color:#777;margin-top:5px}
</style>
</head>
<body>

<div class="header">
🚕 WOLFtaxi
<div class="sub">かんたんタクシー配車</div>
</div>

<div class="card" id="driverRegistration">
<div class="registration">
<h2>👨‍✈️ ドライバー登録</h2>
<p>お客さんに表示するドライバー名を入力してください。</p>
<input id="driverNameInput" type="text" placeholder="例：ドライバー 001" maxlength="30">
<button class="confirm" onclick="registerDriver()">🚕 この名前で登録</button>
</div>
</div>

<div class="card" id="customerScreen">
<h2>🚕 現在のタクシー</h2>
<div id="driverStatusList">読み込み中…</div>
<div class="map" id="customerMap"></div>
<hr>

<h2>👤 お客さん名・ニックネーム</h2>
<input id="customerName" type="text" placeholder="例：たなか" maxlength="30">

<h2>📍 お迎え先</h2>
<input id="pickup" type="text" placeholder="お迎え先を入力">

<h2>🏁 目的地</h2>
<input id="destination" type="text" placeholder="目的地を入力">

<button onclick="callTaxi()">🚕 タクシーを呼ぶ</button>

<div id="result" style="display:none">
<h2>🚕 配車内容</h2>
<p>👤 お客さん</p>
<strong id="showCustomerName"></strong>
<p>📍 お迎え先</p>
<strong id="showPickup"></strong>
<p>🏁 目的地</p>
<strong id="showDestination"></strong>
<button id="confirmButton" class="confirm" onclick="confirmTaxi()">✅ この内容で配車する</button>
</div>

<div id="customerRideInfo" style="display:none">
<div class="infoBox">
<strong id="customerRideText">配車状況を確認しています…</strong>
</div>
<div id="customerQueueBox" class="queueBox"></div>
<div id="customerAckList" class="ackList"></div>
<div id="customerRideMap" class="map"></div>

<div id="customerChat" class="chatBox" style="display:none">
<h2>💬 メッセージ</h2>
<div id="customerMessages" class="chatMessages"></div>
<div class="chatInput">
<input id="customerChatInput" placeholder="メッセージを入力">
<button class="blue" onclick="sendCustomerMessage()">送信</button>
</div>
</div>
</div>
</div>

<div class="card" id="driverScreen">
<h2>🚕 ドライバー画面</h2>

<div class="infoBox">
<strong id="driverDisplayName"></strong>
</div>

<div id="driverCurrentStatus" class="infoBox">
状態：🟢 空車
</div>

<button id="soundButton" class="green" onclick="enableNotification()">
🔔 配車通知をON
</button>

<p id="soundStatus">配車通知をONにしてください</p>

<hr>

<h2>🚕 配車一覧</h2>
<div id="rideList">
<div class="small">配車を待っています…</div>
</div>

<hr>

<h2>🗺️ 現在位置</h2>
<div id="driverMap" class="map"></div>
</div>

<div id="notice" class="notice">
<div style="font-size:60px">🚕</div>
<h1>配車です！</h1>
<div class="noticeBox">
<p id="noticeCustomer"></p>
<p id="noticePickup"></p>
<p id="noticeDestination"></p>
<p id="noticeTime"></p>
</div>
<button onclick="closeNotice()">🔔 通知を確認</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,doc,getDoc,setDoc,updateDoc,query,orderBy,onSnapshot,runTransaction,serverTimestamp,limit}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",
authDomain:"wolftaxi-53314.firebaseapp.com",
projectId:"wolftaxi-53314",
storageBucket:"wolftaxi-53314.firebasestorage.app",
messagingSenderId:"409259660325",
appId:"1:409259660325:web:3506611653a617cccbdbcc",
measurementId:"G-SX3VMEZJ92"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let driverName=localStorage.getItem("wolftaxi_driver_name")||"";
let notificationEnabled=false;
let currentRideId=localStorage.getItem("wolftaxi_customer_ride")||"";

let driverMap=null;
let customerMap=null;
let audioCtx=null;
let unsubCustomerRide=null;
let messageUnsubs={};

let seenRideIds=new Set();
let rideListInitialized=false;

async function start(){

try{

const credential=await signInAnonymously(auth);
currentUser=credential.user;
detectMode();

}catch(error){

document.body.insertAdjacentHTML(
"beforeend",
`
<div style="
position:fixed;
bottom:0;
left:0;
right:0;
background:#ffe5e8;
color:#b00020;
padding:15px;
z-index:99999;
font-weight:bold">
Firebase起動エラー：${escapeHtml(error.message)}
</div>
`
);

console.error(error);

}

}

function detectMode(){

const params=new URLSearchParams(location.search);

if(params.get("driver")==="1"){

if(driverName){

ensureDriverDocument()
.then(showDriverScreen)
.catch(error=>{
alert("ドライバー起動エラー\n\n"+error.message);
});

}else{

document.getElementById("driverRegistration").style.display="block";

}

}else{

showCustomerScreen();

}

}

window.registerDriver=async function(){

const input=document.getElementById("driverNameInput");
const name=input.value.trim();

if(!name){

alert("表示名を入力してください。");
return;

}

driverName=name;

localStorage.setItem("wolftaxi_driver_name",name);

await ensureDriverDocument();

showDriverScreen();

};

async function ensureDriverDocument(){

const ref=doc(db,"drivers",currentUser.uid);
const snap=await getDoc(ref);

const data={
name:driverName,
status:"available",
updatedAt:serverTimestamp()
};

if(!snap.exists()){

await setDoc(ref,{
...data,
latitude:null,
longitude:null
});

}else{

await updateDoc(ref,data);

}

}

function showCustomerScreen(){

document.getElementById("customerScreen").style.display="block";

initCustomerMap();
listenDrivers();

if(currentRideId){

listenCustomerRide(currentRideId);

}

}

function showDriverScreen(){

document.getElementById("driverRegistration").style.display="none";
document.getElementById("driverScreen").style.display="block";

document.getElementById("driverDisplayName").textContent=
"👨‍✈️ "+driverName;

initDriverMap();
listenRides();

}

function listenDrivers(){

onSnapshot(
query(collection(db,"drivers")),
snapshot=>{

const list=document.getElementById("driverStatusList");

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
'<div class="small">現在登録されているタクシーはありません。</div>';

return;

}

snapshot.forEach(ds=>{

const d=ds.data();

const div=document.createElement("div");

div.className=
"statusCard "+(d.status||"available");

div.innerHTML=`
<div class="statusName">
🚕 ${escapeHtml(d.name||"タクシー")}
</div>
<div class="statusText">
${statusLabel(d.status||"available")}
</div>
`;

list.appendChild(div);

});

}
);

}

window.callTaxi=function(){

const name=document.getElementById("customerName").value.trim();
const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();

if(!name||!pickup||!destination){

alert("お客さん名、お迎え先、目的地を入力してください。");
return;

}

document.getElementById("showCustomerName").textContent=name;
document.getElementById("showPickup").textContent=pickup;
document.getElementById("showDestination").textContent=destination;

document.getElementById("result").style.display="block";

};

window.confirmTaxi=async function(){

const customerName=document.getElementById("customerName").value.trim();
const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();

const button=document.getElementById("confirmButton");

button.disabled=true;

try{

const ride=await addDoc(
collection(db,"rides"),
{
customerName,
pickup,
destination,
status:"requested",
acknowledgements:{},
assignedDriverId:null,
assignedDriverName:null,
createdAt:serverTimestamp()
}
);

currentRideId=ride.id;

localStorage.setItem(
"wolftaxi_customer_ride",
ride.id
);

document.getElementById("result").style.display="none";
document.getElementById("customerRideInfo").style.display="block";

listenCustomerRide(ride.id);

}catch(error){

alert("配車送信エラー\n\n"+error.message);

}finally{

button.disabled=false;

}

};

function listenRides(){

onSnapshot(
query(
collection(db,"rides"),
orderBy("createdAt","desc"),
limit(50)
),
snapshot=>{

const list=document.getElementById("rideList");

if(!rideListInitialized){

snapshot.forEach(ds=>seenRideIds.add(ds.id));
rideListInitialized=true;

}else{

snapshot.docChanges().forEach(change=>{

if(
change.type==="added" &&
!seenRideIds.has(change.doc.id)
){

seenRideIds.add(change.doc.id);

if(notificationEnabled){

showRideNotice({
id:change.doc.id,
...change.doc.data()
});

}

}

});

}

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
'<div class="small">現在、配車依頼はありません。</div>';

return;

}

snapshot.forEach(ds=>{

renderRide(
list,
{
id:ds.id,
...ds.data()
}
);

});

}
);

}

function renderRide(list,ride){

const div=document.createElement("div");

div.className="ride";

const ack=ride.acknowledgements||{};

let html=`

<div class="rideTitle">
🚕 配車
</div>

<div>👤 お客さん</div>

<strong>
${escapeHtml(ride.customerName||"未入力")}
</strong>

<div class="time">
🕐 ${formatTime(ride.createdAt)}
</div>

<br>

<div>📍 お迎え先</div>

<strong>
${escapeHtml(ride.pickup||"")}
</strong>

<br><br>

<div>🏁 目的地</div>

<strong>
${escapeHtml(ride.destination||"")}
</strong>

<div class="ackList">

<strong>👨‍✈️ 了解状況</strong>
`;

Object.values(ack).forEach(a=>{

html+=`
<div class="ackRow">
🟢 ${escapeHtml(a.name||"ドライバー")}　了解済み
</div>
`;

});

if(!Object.keys(ack).length){

html+=`
<div class="small">
まだ了解した車両はありません。
</div>
`;

}

html+=`</div>`;

if(ride.assignedDriverId===currentUser.uid){

html+=`
<div class="infoBox">
🚕 ${escapeHtml(
ride.assignedDriverName||driverName
)} が担当しています。
</div>
`;

}else if(ride.assignedDriverId){

html+=`
<div class="infoBox">
🚕 ${escapeHtml(
ride.assignedDriverName||"他のドライバー"
)} が担当しています。
</div>
`;

}

if(ride.status==="requested"){

if(ack[currentUser.uid]){

html+=`
<button class="gray" disabled>
✅ 了解済み
</button>
`;

}else{

html+=`
<button class="blue" data-ack>
✅ この配車を了解
</button>
`;

}

if(ride.assignedDriverId===currentUser.uid){

html+=`
<button class="orange" data-pickup>
🚕 迎車開始
</button>
`;

}

}

if(
ride.status==="pickup" &&
ride.assignedDriverId===currentUser.uid
){

html+=`
<button class="blue" data-arrived>
📍 到着報告
</button>
`;

}

if(
ride.status==="arrived" &&
ride.assignedDriverId===currentUser.uid
){

html+=`
<button class="orange" data-riding>
🚕 お送り中
</button>
`;

}

if(
ride.status==="riding" &&
ride.assignedDriverId===currentUser.uid
){

html+=`
<button class="confirm" data-complete>
✅ 完了報告
</button>
`;

}

if(ride.assignedDriverId===currentUser.uid){

html+=`
<div class="chatBox">
<h3>💬 お客さんへのメッセージ</h3>
<div id="driverMessages-${ride.id}" class="chatMessages"></div>
<div class="chatInput">
<input id="driverChat-${ride.id}" placeholder="メッセージを入力">
<button class="blue" data-send-chat>送信</button>
</div>
</div>
`;

}

div.innerHTML=html;

list.appendChild(div);

const ackButton=div.querySelector("[data-ack]");

if(ackButton){

ackButton.onclick=()=>acknowledgeRide(ride.id);

}

const pickupButton=div.querySelector("[data-pickup]");

if(pickupButton){

pickupButton.onclick=()=>startPickup(ride.id);

}

const arrivedButton=div.querySelector("[data-arrived]");

if(arrivedButton){

arrivedButton.onclick=()=>{
transition(
ride.id,
"pickup",
"arrived"
);
};

}

const ridingButton=div.querySelector("[data-riding]");

if(ridingButton){

ridingButton.onclick=()=>{
transition(
ride.id,
"arrived",
"riding"
);
};

}

const completeButton=div.querySelector("[data-complete]");

if(completeButton){

completeButton.onclick=()=>completeRide(ride.id);

}

const sendChat=div.querySelector("[data-send-chat]");

if(sendChat){

sendChat.onclick=()=>sendDriverMessage(ride.id);

listenMessages(
ride.id,
"driverMessages-"+ride.id
);

}

}

async function acknowledgeRide(rideId){

const ref=doc(db,"rides",rideId);

try{

const result=await runTransaction(
db,
async transaction=>{

const snap=await transaction.get(ref);

if(!snap.exists()){

throw new Error("配車が見つかりません。");

}

const ride=snap.data();

if(ride.status!=="requested"){

throw new Error("この配車は受付中ではありません。");

}

const acknowledgements={
...(ride.acknowledgements||{})
};

if(acknowledgements[currentUser.uid]){

return false;

}

acknowledgements[currentUser.uid]={
name:driverName,
at:serverTimestamp()
};

if(!ride.assignedDriverId){

const driverRef=doc(
db,
"drivers",
currentUser.uid
);

const driverSnap=
await transaction.get(driverRef);

if(
driverSnap.exists() &&
driverSnap.data().status==="available"
){

transaction.update(
ref,
{
acknowledgements,
assignedDriverId:currentUser.uid,
assignedDriverName:driverName,
assignedAt:serverTimestamp()
}
);

return true;

}

}

transaction.update(
ref,
{
acknowledgements
}
);

return false;

}
);

if(result){

alert(
"あなたが担当ドライバーになりました。"
);

}else{

alert(
"了解しました。\n担当はほかのドライバーです。"
);

}

}catch(error){

alert(
"了解処理に失敗しました。\n\n"+
error.message
);

}

}

async function startPickup(rideId){

await transition(
rideId,
"requested",
"pickup"
);

}

async function transition(
rideId,
expected,
next
){

const ref=doc(db,"rides",rideId);

try{

await runTransaction(
db,
async transaction=>{

const snap=await transaction.get(ref);

if(!snap.exists()){

throw new Error("配車が見つかりません。");

}

const ride=snap.data();

if(
ride.assignedDriverId!==currentUser.uid
){

throw new Error(
"この配車の担当ではありません。"
);

}

if(ride.status!==expected){

throw new Error(
"現在の状態では処理できません。"
);

}

transaction.update(
ref,
{
status:next,
updatedAt:serverTimestamp()
}
);

}
);

await updateDriverStatus(next);

}catch(error){

alert(
"状態変更に失敗しました。\n\n"+
error.message
);

}

}

async function completeRide(rideId){

const ref=doc(db,"rides",rideId);

try{

await runTransaction(
db,
async transaction=>{

const snap=await transaction.get(ref);

if(!snap.exists())return;

const ride=snap.data();

if(
ride.assignedDriverId!==currentUser.uid
){

throw new Error(
"この配車の担当ではありません。"
);

}

if(ride.status!=="riding"){

throw new Error(
"現在の状態では完了できません。"
);

}

transaction.delete(ref);

}
);

await updateDriverStatus("available");

alert(
"配車が完了しました。\n空車に戻りました。"
);

}catch(error){

alert(
"完了処理に失敗しました。\n\n"+
error.message
);

}

}

async function updateDriverStatus(status){

await updateDoc(
doc(db,"drivers",currentUser.uid),
{
name:driverName,
status,
updatedAt:serverTimestamp()
}
);

document.getElementById(
"driverCurrentStatus"
).textContent=
"状態："+statusLabel(status);

}

function listenCustomerRide(rideId){

if(unsubCustomerRide){

unsubCustomerRide();

}

document.getElementById(
"customerRideInfo"
).style.display="block";

unsubCustomerRide=onSnapshot(
doc(db,"rides",rideId),
snapshot=>{

if(!snapshot.exists()){

document.getElementById(
"customerRideText"
).textContent=
"配車は完了しました。";

localStorage.removeItem(
"wolftaxi_customer_ride"
);

return;

}

const ride={
id:snapshot.id,
...snapshot.data()
};

document.getElementById(
"customerRideText"
).textContent=
customerStatus(ride);

document.getElementById(
"customerQueueBox"
).textContent=
ride.assignedDriverName
?
`担当：${ride.assignedDriverName}`
:
"担当ドライバーを待っています。";

renderCustomerAck(ride);

if(ride.assignedDriverId){

document.getElementById(
"customerChat"
).style.display="block";

listenMessages(
rideId,
"customerMessages"
);

}

}
);

}

function customerStatus(ride){

if(ride.status==="requested"){

if(ride.assignedDriverName){

return(
"配車を受付しました。"+
ride.assignedDriverName+
" が担当です。"
);

}

return(
"配車依頼を送信しました。"+
"ドライバーの了解を待っています。"
);

}

if(ride.status==="pickup"){

return(
"🟡 "+
(ride.assignedDriverName||"タクシー")+
" が迎車中です。"
);

}

if(ride.status==="arrived"){

return(
"🔵 "+
(ride.assignedDriverName||"タクシー")+
" が到着しました。"
);

}

if(ride.status==="riding"){

return(
"🔴 "+
(ride.assignedDriverName||"タクシー")+
" が乗車中です。"
);

}

return"配車処理中です。";

}

function renderCustomerAck(ride){

const box=
document.getElementById(
"customerAckList"
);

const ack=
ride.acknowledgements||{};

box.innerHTML=
"<strong>👨‍✈️ 配車確認状況</strong>";

Object.entries(ack).forEach(
([id,a])=>{

const div=document.createElement("div");

div.className=
"ackRow";

div.textContent=
id===ride.assignedDriverId
?
`🚕 ${a.name||"ドライバー"}　担当`
:
`🟢 ${a.name||"ドライバー"}　了解済み`;

if(id===ride.assignedDriverId){

div.className=
"ackRow assigned";

}

box.appendChild(div);

}
);

}

function initDriverMap(){

if(driverMap)return;

driverMap=
L.map("driverMap")
.setView(
[33.1127,139.7858],
12
);

L.tileLayer(

window.enableNotification=function(){

notificationEnabled=true;

try{

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

audioCtx.resume();

}catch(error){

console.warn(error);

}

document.getElementById(
"soundButton"
).textContent=
"🔔 配車通知ON";

document.getElementById(
"soundStatus"
).textContent=
"🔔 配車通知がONになっています";

};

function playNotification(){

if(!audioCtx)return;

const oscillator=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
880,
audioCtx.currentTime
);

oscillator.frequency.setValueAtTime(
660,
audioCtx.currentTime+0.18
);

gain.gain.setValueAtTime(
0.001,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.25,
audioCtx.currentTime+0.02
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioCtx.currentTime+0.5
);

oscillator.connect(gain);
gain.connect(audioCtx.destination);

oscillator.start();

oscillator.stop(
audioCtx.currentTime+0.52
);

}

function showRideNotice(ride){

playNotification();

document.getElementById(
"noticeCustomer"
).textContent=
"👤 お客さん："+(ride.customerName||"未入力");

document.getElementById(
"noticeDestination"
).textContent=
"🏁 目的地："+(ride.destination||"");

document.getElementById(
"noticeTime"
).textContent=
"🕐 受付："+formatTime(ride.createdAt);

document.getElementById(
"notice"
).style.display="block";

}

window.closeNotice=function(){

document.getElementById(
"notice"
).style.display="none";

};

function statusLabel(status){

if(status==="available")
return"🟢 空車";

if(status==="pickup")
return"🟡 迎車中";

if(status==="arrived")
return"🔵 到着";

if(status==="riding")
return"🔴 乗車中";

return"⚫ 休車";

}

function formatTime(timestamp){

if(!timestamp)return"—";

const date=
timestamp.toDate
?
timestamp.toDate()
:
new Date(timestamp);

return date.toLocaleTimeString(
"ja-JP",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}

function escapeHtml(text){

const div=document.createElement("div");

div.textContent=
text==null?"":String(text);

return div.innerHTML;

}

async function sendCustomerMessage(){

const input=
document.getElementById(
"customerChatInput"
);

const text=input.value.trim();

if(!text||!currentRideId)return;

await addDoc(
collection(
db,
"rides",
currentRideId,
"messages"
),
{

senderName:
document.getElementById(
"customerName"
).value.trim()||"お客さん",
text,

}

}

async function sendDriverMessage(rideId){

const input=
document.getElementById(
"driverChat-"+rideId
);

const text=input.value.trim();

if(!text)return;

await addDoc(
collection(
db,
"rides",
rideId,
"messages"
),
{
senderId:currentUser.uid,
senderName:driverName,
text,
createdAt:serverTimestamp()
}
);

input.value="";

}

function listenMessages(rideId,elementId){

if(messageUnsubs[elementId]){

messageUnsubs[elementId]();

}

const q=
query(
collection(
db,
"rides",
rideId,
"messages"
),
orderBy("createdAt","asc"),
limit(100)
);

messageUnsubs[elementId]=onSnapshot(
q,
snapshot=>{

const box=
document.getElementById(elementId);

if(!box)return;

box.innerHTML="";

snapshot.forEach(ds=>{

const message=ds.data();

const div=
document.createElement("div");

div.className="chatMsg";

div.innerHTML=`
<div class="chatMeta">
${escapeHtml(message.senderName||"ユーザー")}
　${formatTime(message.createdAt)}
</div>
<div>
${escapeHtml(message.text||"")}
</div>
`;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

}
);

}

start();

</script>
