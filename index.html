<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WOLFtaxi</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
  color:#333;
}

.header{
  background:#111;
  color:#fff;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  margin-top:5px;
  opacity:.8;
}

.card{
  background:#fff;
  margin:15px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

.confirm{
  background:#e60023;
}

.green{
  background:#087f23;
}

.blue{
  background:#174ea6;
}

.orange{
  background:#d97700;
}

.gray{
  background:#666;
}

#customerScreen,
#driverScreen,
#driverRegistration{
  display:none;
}

.infoBox{
  padding:14px;
  border-radius:12px;
  background:#eef5ff;
  color:#174ea6;
  margin:12px 0;
}

.statusCard{
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  background:#f5f5f5;
  border-left:7px solid #777;
}

.statusCard.available{
  border-left-color:#087f23;
}

.statusCard.pickup{
  border-left-color:#d97700;
}

.statusCard.arrived{
  border-left-color:#174ea6;
}

.statusCard.riding{
  border-left-color:#e60023;
}

.statusName{
  font-size:19px;
  font-weight:bold;
}

.statusText{
  font-weight:bold;
  margin-top:5px;
}

.small{
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.ride{
  border:2px solid #e60023;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:#fff;
}

.rideTitle{
  color:#e60023;
  font-weight:bold;
  font-size:19px;
  margin-bottom:15px;
}

.ackList{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  margin:12px 0;
}

.ackRow{
  padding:6px 0;
}

.pending{
  color:#888;
}

.assigned{
  color:#d97700;
  font-weight:bold;
}

.map{
  width:100%;
  height:280px;
  border-radius:15px;
  margin-top:15px;
  overflow:hidden;
}

#driverMap{
  height:300px;
}

.registration{
  text-align:center;
}

.registration p{
  color:#666;
}

.notice{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:#e60023;
  color:#fff;
  padding:25px 20px;
  text-align:center;
}

.notice h1{
  font-size:42px;
  margin:15px 0;
}

.noticeBox{
  background:#fff;
  color:#222;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.notice button{
  background:#fff;
  color:#e60023;
  margin-top:25px;
}

.queueBox{
  padding:16px;
  background:#fff4d6;
  color:#8a5a00;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="header">
🚕 WOLFtaxi
<div class="sub">かんたんタクシー配車</div>
</div>

<!-- ドライバー登録 -->

<div class="card" id="driverRegistration">

<div class="registration">

<h2>👨‍✈️ ドライバー登録</h2>

<p>
お客さんに表示するドライバー名を入力してください。
</p>

<input
id="driverNameInput"
type="text"
placeholder="例：ドライバー 001"
maxlength="30"
>

<button
class="confirm"
onclick="registerDriver()"
>
🚕 この名前で登録
</button>

</div>

</div>

<!-- お客さん -->

<div class="card" id="customerScreen">

<h2>🚕 現在のタクシー</h2>

<div id="driverStatusList">
読み込み中…
</div>

<div
class="map"
id="customerMap"
></div>

<hr>

<h2>📍 お迎え先</h2>

<input
id="pickup"
type="text"
placeholder="お迎え先を入力"
>

<h2>🏁 目的地</h2>

<input
id="destination"
type="text"
placeholder="目的地を入力"
>

<button onclick="callTaxi()">
🚕 タクシーを呼ぶ
</button>

<div id="result" style="display:none">

<h2>🚕 配車内容</h2>

<p>📍 お迎え先</p>
<strong id="showPickup"></strong>

<p>🏁 目的地</p>
<strong id="showDestination"></strong>

<button
id="confirmButton"
class="confirm"
onclick="confirmTaxi()"
>
✅ この内容で配車する
</button>

</div>

<div
id="customerRideInfo"
style="display:none"
>

<div class="infoBox">

<strong id="customerRideText">
配車状況を確認しています…
</strong>

</div>

<div
id="customerQueueBox"
class="queueBox"
></div>

<div
id="customerAckList"
class="ackList"
></div>

<div
id="customerRideMap"
class="map"
></div>

</div>

</div>

<!-- ドライバー -->

<div class="card" id="driverScreen">

<h2>🚕 ドライバー画面</h2>

<div class="infoBox">
<strong id="driverDisplayName"></strong>
</div>

<div
id="driverCurrentStatus"
class="infoBox"
>
状態：🟢 空車
</div>

<button
id="soundButton"
class="green"
onclick="enableNotification()"
>
🔔 配車通知をON
</button>

<p id="soundStatus">
配車通知をONにしてください
</p>

<hr>

<h2>🚕 配車一覧</h2>

<div id="rideList">
<div class="small">
配車を待っています…
</div>
</div>

<hr>

<h2>🗺️ 現在位置</h2>

<div
id="driverMap"
class="map"
></div>

</div>

<!-- 通知 -->

<div id="notice" class="notice">

<div style="font-size:60px">
🚕
</div>

<h1>配車です！</h1>

<div class="noticeBox">

<p id="noticePickup"></p>

<p id="noticeDestination"></p>

</div>

<button onclick="closeNotice()">
🔔 通知を確認
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
doc,
getDoc,
setDoc,
updateDoc,
query,
orderBy,
onSnapshot,
runTransaction,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig={

apiKey:
"AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",

authDomain:
"wolftaxi-53314.firebaseapp.com",

projectId:
"wolftaxi-53314",

storageBucket:
"wolftaxi-53314.firebasestorage.app",

messagingSenderId:
"409259660325",

appId:
"1:409259660325:web:3506611653a617cccbdbcc",

measurementId:
"G-SX3VMEZJ92"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* 基本 */

let currentUser=null;

let driverName=
localStorage.getItem(
"wolftaxi_driver_name"
)||"";

let notificationEnabled=false;

let currentRideId=
localStorage.getItem(
"wolftaxi_customer_ride"
)||"";

let driverMap=null;

let customerMap=null;

let driverMarker=null;

let customerRideMap=null;

let customerRideMarker=null;


/* 起動 */

async function start(){

try{

const credential=
await signInAnonymously(auth);

currentUser=
credential.user;

detectMode();

}catch(error){

document.body.insertAdjacentHTML(
"beforeend",
`
<div style="
position:fixed;
bottom:0;
left:0;
right:0;
background:#ffe5e8;
color:#b00020;
padding:15px;
z-index:99999;
font-weight:bold;
">
Firebase起動エラー：${escapeHtml(
error.message
)}
</div>
`
);

console.error(error);

}

}


/* モード */

function detectMode(){

const params=
new URLSearchParams(
location.search
);

if(
params.get("driver")==="1"
){

if(driverName){

ensureDriverDocument()
.then(showDriverScreen)
.catch(error=>{
alert(
"ドライバー起動エラー\n\n"+
error.message
);
});

}else{

document.getElementById(
"driverRegistration"
).style.display="block";

}

}else{

showCustomerScreen();

}

}


/* ドライバー登録 */

window.registerDriver=
async function(){

const input=
document.getElementById(
"driverNameInput"
);

const name=
input.value.trim();

if(!name){

alert(
"表示名を入力してください❤️"
);

return;

}

driverName=name;

localStorage.setItem(
"wolftaxi_driver_name",
name
);

await ensureDriverDocument();

showDriverScreen();

};


/* ドライバー */

async function ensureDriverDocument(){

const ref=
doc(
db,
"drivers",
currentUser.uid
);

const snap=
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{
name:driverName,
status:"available",
latitude:null,
longitude:null,
updatedAt:serverTimestamp()
}
);

}else{

await updateDoc(
ref,
{
name:driverName,
status:"available",
updatedAt:serverTimestamp()
}
);

}

}


/* お客さん */

function showCustomerScreen(){

document.getElementById(
"customerScreen"
).style.display="block";

initCustomerMap();

listenDrivers();

if(currentRideId){

listenCustomerRide(
currentRideId
);

}

}


/* ドライバー画面 */

function showDriverScreen(){

document.getElementById(
"driverRegistration"
).style.display="none";

document.getElementById(
"driverScreen"
).style.display="block";

document.getElementById(
"driverDisplayName"
).textContent=
"👨‍✈️ "+driverName;

initDriverMap();

listenRides();

}


/* 全車 */

function listenDrivers(){

const q=
query(
collection(db,"drivers")
);

onSnapshot(q,snapshot=>{

const list=
document.getElementById(
"driverStatusList"
);

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
'<div class="small">現在登録されているタクシーはありません。</div>';

return;

}

snapshot.forEach(ds=>{

const d=ds.data();

const status=
d.status||"available";

const div=
document.createElement("div");

div.className=
"statusCard "+status;

div.innerHTML=`

<div class="statusName">
🚕 ${escapeHtml(
d.name||"タクシー"
)}
</div>

<div class="statusText">
${statusLabel(status)}
</div>

`;

list.appendChild(div);

});

});

}


/* 呼ぶ */

window.callTaxi=function(){

const pickup=
document.getElementById(
"pickup"
).value.trim();

const destination=
document.getElementById(
"destination"
).value.trim();

if(!pickup||!destination){

alert(
"お迎え先と目的地を入力してください🚕"
);

return;

}

document.getElementById(
"showPickup"
).textContent=pickup;

document.getElementById(
"showDestination"
).textContent=destination;

document.getElementById(
"result"
).style.display="block";

};


/* 確定 */

window.confirmTaxi=
async function(){

const pickup=
document.getElementById(
"pickup"
).value.trim();

const destination=
document.getElementById(
"destination"
).value.trim();

const button=
document.getElementById(
"confirmButton"
);

button.disabled=true;

try{

const ride=
await addDoc(
collection(db,"rides"),
{

pickup,
destination,

status:"requested",

acknowledgements:{},

assignedDriverId:null,

assignedDriverName:null,

createdAt:
serverTimestamp()

}
);

currentRideId=ride.id;

localStorage.setItem(
"wolftaxi_customer_ride",
ride.id
);

document.getElementById(
"result"
).style.display="none";

document.getElementById(
"customerRideInfo"
).style.display="block";

listenCustomerRide(
ride.id
);

}catch(error){

alert(
"配車送信エラー\n\n"+
error.message
);

}finally{

button.disabled=false;

}

};


/* 配車監視 */

function listenRides(){

const q=
query(
collection(db,"rides"),
orderBy("createdAt","desc")
);

onSnapshot(q,snapshot=>{

const list=
document.getElementById(
"rideList"
);

list.innerHTML="";

if(snapshot.empty){

list.innerHTML=
'<div class="small">現在、配車依頼はありません。</div>';

return;

}

snapshot.forEach(ds=>{

renderRide(
list,
{
id:ds.id,
...ds.data()
}
);

});

});

}


/* 配車表示 */

function renderRide(list,ride){

const div=
document.createElement("div");

div.className="ride";

const ack=
ride.acknowledgements||{};

let html=`

<div class="rideTitle">
🚕 配車
</div>

<div>📍 お迎え先</div>

<strong>
${escapeHtml(ride.pickup||"")}
</strong>

<br><br>

<div>🏁 目的地</div>

<strong>
${escapeHtml(ride.destination||"")}
</strong>

<div class="ackList">

<strong>👨‍✈️ 了解状況</strong>
`;

Object.values(ack).forEach(a=>{

html+=`

<div class="ackRow">
🟢 ${escapeHtml(a.name||"ドライバー")}　了解済み
</div>

`;

});

if(!Object.keys(ack).length){

html+=`
<div class="small">
まだ了解した車両はありません。
</div>
`;

}

html+=`</div>`;


/* ボタン */

if(
ride.status==="requested"
){

if(ack[currentUser.uid]){

html+=`
<button
class="gray"
disabled
>
✅ 了解済み
</button>
`;

}else{

html+=`
<button
class="blue"
data-ack
>
✅ この配車を了解
</button>
`;

}

if(
ride.assignedDriverId===
currentUser.uid
){

html+=`
<button
class="orange"
data-pickup
>
🚕 迎車開始
</button>
`;

}

}

if(
ride.status==="pickup" &&
ride.assignedDriverId===
currentUser.uid
){

html+=`
<button
class="blue"
data-arrived
>
📍 到着報告
</button>
`;

}

if(
ride.status==="arrived" &&
ride.assignedDriverId===
currentUser.uid
){

html+=`
<button
class="orange"
data-riding
>
🚕 お送り中
</button>
`;

}

if(
ride.status==="riding" &&
ride.assignedDriverId===
currentUser.uid
){

html+=`
<button
class="confirm"
data-complete
>
✅ 完了報告
</button>
`;

}

if(
ride.assignedDriverId &&
ride.assignedDriverId!==currentUser.uid
){

html+=`

<div class="infoBox">
🚕 ${escapeHtml(
ride.assignedDriverName||
"他のドライバー"
)} が担当しています。
</div>

`;

}

div.innerHTML=html;

list.appendChild(div);


/* イベント */

const ackButton=
div.querySelector("[data-ack]");

if(ackButton){

ackButton.onclick=
()=>acknowledgeRide(ride.id);

}

const pickupButton=
div.querySelector("[data-pickup]");

if(pickupButton){

pickupButton.onclick=
()=>startPickup(ride.id);

}

const arrivedButton=
div.querySelector("[data-arrived]");

if(arrivedButton){

arrivedButton.onclick=
()=>transition(
ride.id,
"pickup",
"arrived"
);

}

const ridingButton=
div.querySelector("[data-riding]");

if(ridingButton){

ridingButton.onclick=
()=>transition(
ride.id,
"arrived",
"riding"
);

}

const completeButton=
div.querySelector("[data-complete]");

if(completeButton){

completeButton.onclick=
()=>completeRide(ride.id);

}

}


/* 了解 */

async function acknowledgeRide(
rideId
){

const ref=
doc(db,"rides",rideId);

try{

const result=
await runTransaction(
db,
async transaction=>{

const snap=
await transaction.get(ref);

if(!snap.exists()){

throw new Error(
"配車が見つかりません。"
);

}

const ride=snap.data();

if(
ride.status!=="requested"
){

throw new Error(
"この配車は受付中ではありません。"
);

}

const acknowledgements={
...(ride.acknowledgements||{})
};

if(
acknowledgements[currentUser.uid]
){

return false;

}

acknowledgements[
currentUser.uid
]={

name:driverName,

at:serverTimestamp()

};


/*
最初に了解した車だけ担当
*/

if(
!ride.assignedDriverId
){

transaction.update(
ref,
{

acknowledgements,

assignedDriverId:
currentUser.uid,

assignedDriverName:
driverName,

assignedAt:
serverTimestamp()

}
);

return true;

}

transaction.update(
ref,
{
acknowledgements
}
);

return false;

}
);

if(result){

alert(
"🚕 了解しました！\n\n"+
"あなたが担当車両になりました❤️"
);

}else{

alert(
"✅ 了解済みにしました❤️\n\n"+
"担当は他のドライバーです。"
);

}

}catch(error){

alert(
"了解処理に失敗しました。\n\n"+
error.message
);

}

}


/* 迎車 */

async function startPickup(
rideId
){

await transition(
rideId,
"requested",
"pickup"
);

}


/* 状態遷移 */

async function transition(
rideId,
expected,
next
){

const ref=
doc(db,"rides",rideId);

try{

await runTransaction(
db,
async transaction=>{

const snap=
await transaction.get(ref);

if(!snap.exists()){

throw new Error(
"配車が見つかりません。"
);

}

const ride=snap.data();

if(
ride.assignedDriverId!==
currentUser.uid
){

throw new Error(
"この配車の担当ではありません。"
);

}

if(
ride.status!==expected
){

throw new Error(
"現在の状態では処理できません。"
);

}

transaction.update(
ref,
{

status:next,

updatedAt:
serverTimestamp()

}
);

}
);

await updateDriverStatus(
next
);

}catch(error){

alert(
"状態変更に失敗しました。\n\n"+
error.message
);

}

}


/* 完了 */

async function completeRide(
rideId
){

const ref=
doc(db,"rides",rideId);

try{

await runTransaction(
db,
async transaction=>{

const snap=
await transaction.get(ref);

if(!snap.exists()){

return;

}

const ride=snap.data();

if(
ride.assignedDriverId!==
currentUser.uid
){

throw new Error(
"この配車の担当ではありません。"
);

}

if(
ride.status!=="riding"
){

throw new Error(
"現在の状態では完了できません。"
);

}

transaction.delete(ref);

}
);

await updateDriverStatus(
"available"
);

alert(
"✅ 配車完了❤️\n\n空車に戻りました。"
);

}catch(error){

alert(
"完了処理に失敗しました。\n\n"+
error.message
);

}

}


/* ドライバー状態 */

async function updateDriverStatus(
status
){

await updateDoc(
doc(
db,
"drivers",
currentUser.uid
),
{

name:driverName,

status,

updatedAt:
serverTimestamp()

}
);

document.getElementById(
"driverCurrentStatus"
).textContent=
"状態："+statusLabel(status);

}


/* お客さん側配車 */

function listenCustomerRide(
rideId
){

document.getElementById(
"customerRideInfo"
).style.display="block";

onSnapshot(
doc(db,"rides",rideId),
snapshot=>{

if(!snapshot.exists()){

document.getElementById(
"customerRideText"
).textContent=
"🚕 配車は完了しました。";

localStorage.removeItem(
"wolftaxi_customer_ride"
);

return;

}

const ride={
id:snapshot.id,
...snapshot.data()
};

document.getElementById(
"customerRideText"
).textContent=
customerStatus(ride);

renderCustomerAck(ride);

}
);

}


/* お客さん状態 */

function customerStatus(ride){

if(
ride.status==="requested"
){

if(ride.assignedDriverName){

return(
"🚕 "+
ride.assignedDriverName+
" が担当になりました。迎車開始を待っています。"
);

}

return(
"🚕 配車依頼を送信しました。ドライバーの了解を待っています。"
);

}

if(
ride.status==="pickup"
){

return(
"🟡 "+
(ride.assignedDriverName||"タクシー")+
" が迎車中です。"
);

}

if(
ride.status==="arrived"
){

return(
"🔵 "+
(ride.assignedDriverName||"タクシー")+
" が到着しました。"
);

}

if(
ride.status==="riding"
){

return(
"🔴 "+
(ride.assignedDriverName||"タクシー")+
" が乗車中です。"
);

}

return "🚕 配車処理中です。";

}


/* お客さん了解状況 */

function renderCustomerAck(ride){

const box=
document.getElementById(
"customerAckList"
);

const ack=
ride.acknowledgements||{};

box.innerHTML=
"<strong>👨‍✈️ 配車確認状況</strong>";

Object.entries(ack).forEach(
([id,a])=>{

const div=
document.createElement("div");

div.className="ackRow";

div.textContent=
"🟢 "+
(a.name||"ドライバー")+
"　了解済み";

if(
id===ride.assignedDriverId
){

div.className=
"ackRow assigned";

div.textContent=
"🚕 "+
(a.name||"ドライバー")+
"　担当";

}

box.appendChild(div);

});

}


/* マップ */

function initDriverMap(){

if(driverMap)return;

driverMap=
L.map("driverMap")
.setView(
[33.1127,139.7858],
12
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:
"&copy; OpenStreetMap contributors"
}
).addTo(driverMap);

}


function initCustomerMap(){

);

/* 通知 */

window.enableNotification=
function(){

notificationEnabled=true;

document.getElementById(
"soundButton"
).textContent=
"🔔 配車通知ON";

document.getElementById(
"soundStatus"
).textContent=
"🔔 配車通知がONになっています";

};


window.closeNotice=
function(){

document.getElementById(
"notice"
).style.display="none";

};


/* 状態名 */

function statusLabel(status){

if(status==="available")
return "🟢 空車";

if(status==="pickup")
return "🟡 迎車中";

if(status==="arrived")
return "🔵 到着";

if(status==="riding")
return "🔴 乗車中";

return "⚫ 休車";

}


/* HTML */

function escapeHtml(text){

const div=
document.createElement("div");

div.textContent=
text==null?"":String(text);

return div.innerHTML;

}


/* 起動 */

start();
