<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLFtaxi</title>
<style>
body{margin:0;font-family:sans-serif;background:#f7f7f7;color:#333}
.header{background:#111;color:white;padding:20px;text-align:center;font-size:28px;font-weight:bold}
.sub{font-size:14px;margin-top:5px;opacity:.8}
.card{background:white;margin:20px;padding:20px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
h2{margin-top:0}
input{width:100%;box-sizing:border-box;padding:15px;margin:8px 0 20px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:16px;margin-top:5px;border:none;border-radius:12px;background:#111;color:white;font-size:18px;font-weight:bold}
.confirm{background:#e60023}
.driver{text-align:center;margin-top:15px;font-size:14px}
#result{display:none;margin-top:20px;padding:15px;background:#f1f1f1;border-radius:12px}
#complete{display:none;margin-top:20px;padding:20px;background:#fff0f2;border-radius:12px;text-align:center}
#complete h2{color:#e60023}
#driverScreen{display:none}
.ride{border:2px solid #e60023;border-radius:14px;padding:15px;margin-top:15px;background:white}
.status{font-weight:bold;color:#e60023;font-size:18px;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">🚕 WOLFtaxi<div class="sub">かんたんタクシー配車</div></div>

<div class="card" id="customerScreen">
<h2>📍 お迎え先</h2>
<input id="pickup" type="text" placeholder="お迎え先を入力">
<h2>🏁 目的地</h2>
<input id="destination" type="text" placeholder="目的地を入力">
<button onclick="callTaxi()">🚕 タクシーを呼ぶ</button>

<div id="result">
<h2>🚕 配車内容</h2>
<p>📍 お迎え先</p><p id="showPickup"></p>
<p>🏁 目的地</p><p id="showDestination"></p>
<button class="confirm" onclick="confirmTaxi()">✅ この内容で配車する</button>
</div>

<div id="complete">
<h2>🚕 配車を受け付けました</h2>
<p>ドライバー001がお迎えにあがります。</p>
<p>📍 お迎え先</p><p id="completePickup"></p>
<p>🏁 目的地</p><p id="completeDestination"></p>
</div>

<div class="driver">ドライバー　001</div>
</div>

<div class="card" id="driverScreen">
<h2>🚕 ドライバー画面</h2>
<div class="driver">ドライバー　001</div>
<hr>
<div id="rideList">配車を待っています…</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp,query,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",
authDomain:"wolftaxi-53314.firebaseapp.com",
projectId:"wolftaxi-53314",
storageBucket:"wolftaxi-53314.firebasestorage.app",
messagingSenderId:"409259660325",
appId:"1:409259660325:web:3506611653a617cccbdbcc",
measurementId:"G-SX3VMEZJ92"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

signInAnonymously(auth).then(()=>{
console.log("Firebase認証OK");
startDriverMode();
}).catch(error=>{
console.error(error);
alert("Firebaseへの接続に失敗しました");
});

window.callTaxi=function(){
const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();
if(!pickup||!destination){
alert("お迎え先と目的地を入力してください🚕");
return;
}
document.getElementById("showPickup").textContent=pickup;
document.getElementById("showDestination").textContent=destination;
document.getElementById("result").style.display="block";
};

window.confirmTaxi=async function(){
const pickup=document.getElementById("pickup").value.trim();
const destination=document.getElementById("destination").value.trim();
if(!pickup||!destination){
alert("入力内容を確認してください");
return;
}
try{
await addDoc(collection(db,"rides"),{
pickup:pickup,
destination:destination,
driver:"001",
status:"requested",
createdAt:serverTimestamp()
});
document.getElementById("completePickup").textContent=pickup;
document.getElementById("completeDestination").textContent=destination;
document.getElementById("result").style.display="none";
document.getElementById("complete").style.display="block";
document.getElementById("pickup").value="";
document.getElementById("destination").value="";
}catch(error){
console.error(error);
alert("配車の送信に失敗しました。\n"+error.message);
}
};

function startDriverMode(){
const params=new URLSearchParams(window.location.search);
if(params.get("driver")!=="001")return;

document.getElementById("customerScreen").style.display="none";
document.getElementById("driverScreen").style.display="block";

const ridesQuery=query(collection(db,"rides"),orderBy("createdAt","desc"));

onSnapshot(ridesQuery,snapshot=>{
const list=document.getElementById("rideList");
if(snapshot.empty){
list.textContent="現在、配車依頼はありません。";
return;
}
list.innerHTML="";
snapshot.forEach(doc=>{
const ride=doc.data();
const div=document.createElement("div");
div.className="ride";
div.innerHTML=`
<div class="status">🚕 新しい配車</div>
<div>📍 お迎え先</div>
<strong>${escapeHtml(ride.pickup||"")}</strong>
<br><br>
<div>🏁 目的地</div>
<strong>${escapeHtml(ride.destination||"")}</strong>
<br><br>
<div>👨‍✈️ ドライバー：001</div>`;
list.appendChild(div);
});
},error=>{
console.error(error);
document.getElementById("rideList").textContent="配車情報の読み込みに失敗しました。";
});
}

function escapeHtml(text){
const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;
}
</script>
</body>
</html>
