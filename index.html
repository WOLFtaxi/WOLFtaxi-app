<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>WOLFtaxi</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
  color:#333;
}

.header{
  background:#111;
  color:#fff;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  margin-top:5px;
  opacity:.8;
}

.card{
  background:#fff;
  margin:15px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:7px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.confirm{
  background:#e60023;
}

.green{
  background:#087f23;
}

.blue{
  background:#174ea6;
}

.orange{
  background:#d97700;
}

.gray{
  background:#666;
}

.driver{
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

#customerScreen,
#driverScreen{
  display:none;
}

#result{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f1f1f1;
  border-radius:12px;
}

#complete{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fff0f2;
  border-radius:12px;
  text-align:center;
}

#complete h2{
  color:#e60023;
}

.loadingBox{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#eef5ff;
  color:#174ea6;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#ffe5e8;
  color:#b00020;
  border:2px solid #e60023;
  border-radius:12px;
  font-weight:bold;
  white-space:pre-wrap;
  word-break:break-word;
}

.notice{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:#e60023;
  color:#fff;
  padding:25px 20px;
  text-align:center;
}

.notice h1{
  font-size:42px;
  margin:15px 0;
}

.noticeBox{
  background:#fff;
  color:#222;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.notice button{
  background:#fff;
  color:#e60023;
  margin-top:25px;
}

.statusCard{
  padding:14px;
  margin:10px 0;
  border-radius:14px;
  background:#f5f5f5;
  border-left:7px solid #777;
}

.statusCard.available{
  border-left-color:#087f23;
}

.statusCard.pickup{
  border-left-color:#d97700;
}

.statusCard.riding{
  border-left-color:#e60023;
}

.statusCard.arrived{
  border-left-color:#174ea6;
}

.statusName{
  font-size:19px;
  font-weight:bold;
}

.statusText{
  font-weight:bold;
  margin-top:5px;
}

.small{
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.ride{
  border:2px solid #e60023;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:#fff;
}

.rideTitle{
  color:#e60023;
  font-weight:bold;
  font-size:19px;
  margin-bottom:15px;
}

.ackList{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  margin:12px 0;
}

.ackRow{
  padding:6px 0;
}

.ackRow.pending{
  color:#888;
}

.ackRow.assigned{
  font-weight:bold;
  color:#d97700;
}

.map{
  width:100%;
  height:280px;
  border-radius:15px;
  margin-top:15px;
  overflow:hidden;
}

#driverMap{
  height:300px;
}

.registration{
  text-align:center;
}

.registration p{
  color:#666;
}

.infoBox{
  padding:14px;
  border-radius:12px;
  background:#eef5ff;
  color:#174ea6;
  margin:12px 0;
}

.queueBox{
  padding:16px;
  background:#fff4d6;
  color:#8a5a00;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}

.customerRideStatus{
  border-radius:15px;
  padding:18px;
  margin-top:15px;
  background:#f5f5f5;
  text-align:center;
}

.customerRideStatus .big{
  font-size:22px;
  font-weight:bold;
}

#driverRegistration{
  display:none;
}

#customerRideInfo{
  display:none;
}

.assignedBadge{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:20px;
  background:#fff0d8;
  color:#d97700;
  font-weight:bold;
}

.queueItem{
  padding:8px 0;
  border-bottom:1px solid #ddd;
}

.queueItem:last-child{
  border-bottom:0;
}

.ok{
  color:#087f23;
  font-weight:bold;
}

.wait{
  color:#777;
}

.danger{
  color:#e60023;
  font-weight:bold;
}

/* 全車両GPS表示 */

.driverMapMarker{
  font-weight:bold;
}

/* お客さん側の車両一覧 */

.vehicleCount{
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  background:#eef5ff;
  color:#174ea6;
  font-weight:bold;
  text-align:center;
}

</style>

</head>

<body>


<div class="header">

🚕 WOLFtaxi

<div class="sub">
かんたんタクシー配車
</div>

</div>


<!-- ================================
     ドライバー登録
     ================================ -->

<div
  class="card"
  id="driverRegistration"
>

<div class="registration">

<h2>
👨‍✈️ ドライバー登録
</h2>

<p>
お客さんに表示するドライバー名を入力してください。
</p>

<input
  id="driverNameInput"
  type="text"
  placeholder="例：ドライバー 001"
  maxlength="30"
>

<button
  class="confirm"
  onclick="registerDriver()"
>
🚕 この名前で登録
</button>

</div>

</div>


<!-- ================================
     お客さん画面
     ================================ -->

<div
  class="card"
  id="customerScreen"
>

<h2>
🚕 現在のタクシー
</h2>

<div id="driverStatusList">
読み込み中…
</div>


<div
  class="map"
  id="customerMap"
></div>


<hr style="margin:25px 0">


<h2>
📍 お迎え先
</h2>

<input
  id="pickup"
  type="text"
  placeholder="お迎え先を入力"
>


<h2>
🏁 目的地
</h2>

<input
  id="destination"
  type="text"
  placeholder="目的地を入力"
>


<button onclick="callTaxi()">
🚕 タクシーを呼ぶ
</button>


<!-- 配車確認 -->

<div id="result">

<h2>
🚕 配車内容
</h2>

<p>
📍 お迎え先
</p>

<strong id="showPickup"></strong>

<p>
🏁 目的地
</p>

<strong id="showDestination"></strong>

<button
  id="confirmButton"
  class="confirm"
  onclick="confirmTaxi()"
>
✅ この内容で配車する
</button>

</div>


<!-- 送信中 -->

<div
  id="loadingBox"
  class="loadingBox"
>
🚕 配車を送信しています…
</div>


<!-- エラー -->

<div
  id="errorBox"
  class="errorBox"
></div>


<!-- 現在の配車 -->

<div id="customerRideInfo">

<div class="customerRideStatus">

<div class="big">
🚕 配車受付済み
</div>

<p id="customerQueueText">
配車状況を確認しています…
</p>

</div>


<!-- 何件前か -->

<div
  id="customerQueueBox"
  class="queueBox"
></div>


<!-- 了解状況 -->

<div
  id="customerAckList"
  class="ackList"
></div>


<!-- 担当車両GPS -->

<div
  id="customerRideMap"
  class="map"
></div>

</div>


<!-- 完了 -->

<div id="complete">

<h2>
🚕 配車を受け付けました
</h2>

<p>
ドライバーがお迎えにあがります。
</p>

<p>
📍 お迎え先
</p>

<strong id="completePickup"></strong>

<p>
🏁 目的地
</p>

<strong id="completeDestination"></strong>

</div>

</div>


<!-- ================================
     ドライバー画面
     ================================ -->

<div
  class="card"
  id="driverScreen"
>

<h2>
🚕 ドライバー画面
</h2>


<div class="driver">

<strong id="driverDisplayName"></strong>

</div>


<!-- 現在の状態 -->

<div
  id="driverCurrentStatus"
  class="infoBox"
>
状態：🟢 空車
</div>


<!-- 通知 -->

<button
  id="soundButton"
  class="green"
  onclick="enableNotification()"
>
🔔 配車通知をON
</button>

<p
  id="soundStatus"
  class="driver"
>
配車通知をONにしてください
</p>


<hr>


<h2>
🚕 配車一覧
</h2>


<div id="rideList">

<div class="small">
配車を待っています…
</div>

</div>


<hr>


<h2>
🗺️ 現在位置
</h2>


<div
  id="driverMap"
  class="map"
></div>

</div>


<!-- ================================
     配車通知画面
     ================================ -->

<div
  id="notice"
  class="notice"
>

<div style="font-size:60px">
🚕
</div>

<h1>
配車です！
</h1>


<div class="noticeBox">

<p id="noticePickup"></p>

<p id="noticeDestination"></p>

</div>


<button onclick="closeNoticeOnly()">
🔔 通知を確認
</button>

</div>


<script type="module">


/* =====================================
   Firebase
   ===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot,
  runTransaction
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import L from
"https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js";


/* =====================================
   Firebase設定
   ===================================== */

const firebaseConfig = {

apiKey:
"AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",

authDomain:
"wolftaxi-53314.firebaseapp.com",

projectId:
"wolftaxi-53314",

storageBucket:
"wolftaxi-53314.firebasestorage.app",

messagingSenderId:
"409259660325",

appId:
"1:409259660325:web:3506611653a617cccbdbcc",

measurementId:
"G-SX3VMEZJ92"

};


const app =
initializeApp(
firebaseConfig
);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =====================================
   基本変数
   ===================================== */

let currentUser = null;

let driverName =
localStorage.getItem(
"wolftaxi_driver_name"
) || "";

let notificationEnabled = false;

let currentAudio = null;

let notificationRunning = false;

let notificationRideId = null;

let notificationStopTimer = null;

let notificationNextSoundTimer = null;

let speechTimer = null;

let driverMap = null;

let driverMarker = null;

let customerMap = null;

let customerRideMap = null;

let customerRideMarkers = {};

let customerVehicleMarkers = {};

let assignedDriverUnsubscribes = {};

let customerRideUnsubscribe = null;

let customerDriverUnsubscribe = null;

let currentCustomerRideId =
localStorage.getItem(
"wolftaxi_customer_ride"
) || "";

let sendingRide = false;

let gpsStarted = false;

let knownRideIds =
new Set();


/* =====================================
   通知音
   ===================================== */

const sounds = {

normal:
"mixkit-software-interface-start-2574.wav",

haneda:
"mixkit-arcade-bonus-alert-767.wav",

narita:
"mixkit-manual-siren-fire-alert-1652.wav",

zaion:
"mixkit-guitar-notification-alert-2320.wav"

};


/* =====================================
   八丈島初期表示位置
   ===================================== */

const HACHIJO = [
33.1127,
139.7858
];


/* =====================================
   起動
   ===================================== */

async function start(){

try{

const credential =
await signInAnonymously(
auth
);

currentUser =
credential.user;

detectMode();

}catch(error){

alert(
"Firebaseに接続できません。\n\n" +
getErrorMessage(error)
);

}

}


/* =====================================
   ドライバー登録
   ===================================== */

window.registerDriver =
async function(){

const input =
document.getElementById(
"driverNameInput"
);

const name =
input.value.trim();

if(!name){

alert(
"表示名を入力してください❤️"
);

return;

}

driverName =
name;

localStorage.setItem(
"wolftaxi_driver_name",
name
);

try{

await ensureDriverDocument();

showDriverScreen();

}catch(error){

alert(
"ドライバー登録に失敗しました。\n\n" +
getErrorMessage(error)
);

}

};


/* =====================================
   ドライバー情報
   ===================================== */

async function ensureDriverDocument(){

const ref =
doc(
db,
"drivers",
currentUser.uid
);

const snap =
await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{

name:
driverName,

status:
"available",

latitude:
null,

longitude:
null,

updatedAt:
serverTimestamp()

}
);

}else{

await updateDoc(
ref,
{

name:
driverName,

status:
"available",

updatedAt:
serverTimestamp()

}
);

}

}


/* =====================================
   お客さん画面
   ===================================== */

function showCustomerScreen(){

document.getElementById(
"customerScreen"
).style.display =
"block";

document.getElementById(
"driverScreen"
).style.display =
"none";

document.getElementById(
"driverRegistration"
).style.display =
"none";

initCustomerMap();

listenDrivers();

if(currentCustomerRideId){

listenCustomerRide(
currentCustomerRideId
);

}

}


/* =====================================
   ドライバー画面
   ===================================== */

function showDriverScreen(){

document.getElementById(
"customerScreen"
).style.display =
"none";

document.getElementById(
"driverRegistration"
).style.display =
"none";

document.getElementById(
"driverScreen"
).style.display =
"block";

document.getElementById(
"driverDisplayName"
).textContent =
"👨‍✈️ " +
driverName;

initDriverMap();

listenRides();

startGPS();

}


/* =====================================
   モード判定
   ===================================== */

function detectMode(){

const params =
new URLSearchParams(
location.search
);

if(
params.get("driver") === "1"
){

if(driverName){

ensureDriverDocument()
.then(
showDriverScreen
)
.catch(
error => {

alert(
"ドライバー情報の読み込みに失敗しました。\n\n" +
getErrorMessage(error)
);

}
);

}else{

document.getElementById(
"driverRegistration"
).style.display =
"block";

document.getElementById(
"customerScreen"
).style.display =
"none";

}

}else{

showCustomerScreen();

}

}


/* =====================================
   全車両状態＋GPS監視
   ===================================== */

function listenDrivers(){

const q =
query(
collection(
db,
"drivers"
)
);

onSnapshot(
q,
snapshot => {

const list =
document.getElementById(
"driverStatusList"
);

list.innerHTML = "";


/* -------------------------------------
   登録車両なし
   ------------------------------------- */

if(snapshot.empty){

list.innerHTML =
'<div class="small">' +
"現在登録されているタクシーはありません。" +
"</div>";

return;

}


const drivers = [];


snapshot.forEach(
ds => {

drivers.push({
id:
ds.id,
...ds.data()
});

});


/* -------------------------------------
   車両一覧
   ------------------------------------- */

const count =
document.createElement(
"div"
);

count.className =
"vehicleCount";

count.textContent =
"🚕 登録車両 " +
drivers.length +
"台";

list.appendChild(
count
);


drivers.forEach(
d => {

const status =
d.status ||
"available";


const card =
document.createElement(
"div"
);

card.className =
"statusCard " +
status;


card.innerHTML =

'<div class="statusName">' +

"🚕 " +

escapeHtml(
d.name ||
"タクシー"
) +

"</div>" +

'<div class="statusText">' +

statusLabel(
status
) +

"</div>" +

'<div class="small">' +

(
d.latitude != null &&
d.longitude != null

?

"📍 現在位置を約60秒ごとに更新"

:

"📍 位置情報取得待ち"

) +

"</div>";


list.appendChild(
card
);


/* -------------------------------------
   全車両を地図へ表示
   ------------------------------------- */

if(
d.latitude != null &&
d.longitude != null
){

updateCustomerVehicleMarker(
d
);

}

}
);


/* -------------------------------------
   古い車両マーカーを整理
   ------------------------------------- */

const currentIds =
new Set(
drivers.map(
d => d.id
)
);


Object.keys(
customerVehicleMarkers
).forEach(
id => {

if(
!currentIds.has(id)
){

if(
customerMap
){

customerMap.removeLayer(
customerVehicleMarkers[id]
);

}

delete customerVehicleMarkers[id];

}

});

},

error => {

console.error(
"ドライバー監視エラー",
error
);

}

);

}


/* =====================================
   お客さん側 全車両マーカー
   ===================================== */

function updateCustomerVehicleMarker(
driver
){

if(
!customerMap
){

return;

}

const position = [

driver.latitude,

driver.longitude

];


if(
!customerVehicleMarkers[
driver.id
]
){

customerVehicleMarkers[
driver.id
] =
L.marker(
position
)
.addTo(
customerMap
)
.bindPopup(
"🚕 " +
(
driver.name ||
"タクシー"
) +
"<br>" +
statusLabel(
driver.status ||
"available"
)
);

}else{

customerVehicleMarkers[
driver.id
].setLatLng(
position
);

customerVehicleMarkers[
driver.id
].setPopupContent(
"🚕 " +
(
driver.name ||
"タクシー"
) +
"<br>" +
statusLabel(
driver.status ||
"available"
)
);

}

}


/* =====================================
   状態表示
   ===================================== */

function statusLabel(
status
){

switch(status){

case "available":
return "🟢 空車";

case "pickup":
return "🟡 迎車中";

case "arrived":
return "🔵 到着";

case "riding":
return "🔴 乗車中";

default:
return "⚫ 休車";

}

}


/* =====================================
   タクシーを呼ぶ
   ===================================== */

window.callTaxi =
function(){

clearError();

const pickup =
document.getElementById(
"pickup"
).value.trim();

const destination =
document.getElementById(
"destination"
).value.trim();

if(
!pickup ||
!destination
){

alert(
"お迎え先と目的地を入力してください🚕"
);

return;

}

document.getElementById(
"showPickup"
).textContent =
pickup;

document.getElementById(
"showDestination"
).textContent =
destination;

document.getElementById(
"result"
).style.display =
"block";

};


/* =====================================
   配車確定
   ===================================== */

window.confirmTaxi =
async function(){

if(sendingRide){

return;

}

clearError();

const pickup =
document.getElementById(
"pickup"
).value.trim();

const destination =
document.getElementById(
"destination"
).value.trim();

if(
!pickup ||
!destination
){

return;

}

sendingRide =
true;

const button =
document.getElementById(
"confirmButton"
);

button.disabled =
true;

button.textContent =
"🚕 配車を送信中…";

document.getElementById(
"loadingBox"
).style.display =
"block";

try{

const rideRef =
await addDoc(
collection(
db,
"rides"
),
{

pickup:
pickup,

destination:
destination,

status:
"requested",

acknowledgements:
{},

assignedDriverId:
null,

assignedDriverName:
null,

assignedAt:
null,

createdAt:
serverTimestamp()

}
);


currentCustomerRideId =
rideRef.id;

localStorage.setItem(
"wolftaxi_customer_ride",
rideRef.id
);


document.getElementById(
"completePickup"
).textContent =
pickup;

document.getElementById(
"completeDestination"
).textContent =
destination;

document.getElementById(
"result"
).style.display =
"none";

document.getElementById(
"loadingBox"
).style.display =
"none";

document.getElementById(
"complete"
).style.display =
"block";

document.getElementById(
"customerRideInfo"
).style.display =
"block";


listenCustomerRide(
rideRef.id
);


}catch(error){

document.getElementById(
"loadingBox"
).style.display =
"none";

showError(

/* =====================================
   配車了解
   ===================================== */

async function acknowledgeRide(
rideId
){

try{

const ref =
doc(
db,
"rides",
rideId
);


const result =
await runTransaction(
db,
async transaction => {

const snap =
await transaction.get(
ref
);


if(!snap.exists()){

throw new Error(
"配車が見つかりません。"
);

}


const ride =
snap.data();


if(
ride.status !==
"requested"
){

throw new Error(
"この配車は受付中ではありません。"
);

}


const acknowledgements =
{
...(ride.acknowledgements || {})
};


/* -------------------------------------
   すでに了解済み
   ------------------------------------- */

if(
acknowledgements[
currentUser.uid
]
){

return {

already:true,

becameAssigned:false

};

}


/* -------------------------------------
   了解済みに追加
   ------------------------------------- */

acknowledgements[
currentUser.uid
] = {

name:
driverName,

at:
serverTimestamp()

};


/* -------------------------------------
   最初に了解した人を担当にする
   ------------------------------------- */

if(
!ride.assignedDriverId
){

transaction.update(
ref,
{

acknowledgements:
acknowledgements,

assignedDriverId:
currentUser.uid,

assignedDriverName:
driverName,

assignedAt:
serverTimestamp()

}
);


return {

already:false,

becameAssigned:true

};

}


/* -------------------------------------
   担当車はすでに決定済み
   自分は了解済みだけ
   ------------------------------------- */

transaction.update(
ref,
{

acknowledgements:
acknowledgements

}
);


return {

already:false,

becameAssigned:false

};

}
);


if(
result.already
){

return;

}


if(
result.becameAssigned
){

alert(
"🚕 了解しました！\n\n" +
"あなたが担当車両になりました❤️"
);

}else{

alert(
"✅ 了解済みにしました❤️\n\n" +
"担当は他のドライバーです。"
);

}


}catch(error){

alert(
"了解処理に失敗しました。\n\n" +
getErrorMessage(error)
);

}

}

async function transitionRide(
ref,

nextStatus,
extraData
){

await runTransaction(
db,
async transaction => {

await transaction.get(
ref
);


if(!snap.exists()){

);

);

}

{

);

);

return;

}


customerRideMap =
L.map(
"customerRideMap"
).setView(
HACHIJO,
12
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:
19,

attribution:
"&copy; OpenStreetMap contributors"

}
).addTo(
customerRideMap
);

}


/* =====================================
   通知音振り分け
   ===================================== */

function getSoundFile(
ride
){

const pickup =
(
ride.pickup ||
""
).trim();


const destination =
(
ride.destination ||
""
).trim();


if(
pickup.includes(
"ザイオン"
)
){

return sounds.zaion;

}


if(
destination.includes(
"成田"
)
){

return sounds.narita;

}


if(
destination.includes(
"羽田"
)
){

return sounds.haneda;

}


return sounds.normal;

}


/* =====================================
   配車通知
   ===================================== */

function startNotification(
ride,
rideId
){

if(
!notificationEnabled
){

showNotice(
ride
);

return;

}


if(
notificationRunning &&
notificationRideId ===
rideId
){

return;

}


stopNotificationSound();


notificationRunning =
true;

notificationRideId =
rideId;


showNotice(
ride
);


playNotificationSound(
ride
);


speakTaxi();


speechTimer =
setInterval(
() => {

if(
notificationRunning
){

speakTaxi();

}

},
7000
);


notificationStopTimer =
setTimeout(
() => {

stopNotificationSound();

},
30000
);

}


/* =====================================
   通知音再生
   ===================================== */

function playNotificationSound(
ride
){

if(
!notificationEnabled ||
!notificationRunning
){

return;

}


if(currentAudio){

currentAudio.pause();

currentAudio.onended =
null;

}


if(
notificationNextSoundTimer
){

clearTimeout(
notificationNextSoundTimer
);

notificationNextSoundTimer =
null;

}


currentAudio =
new Audio(
getSoundFile(
ride
)
);


currentAudio.volume =
1;


currentAudio.onended =
() => {

if(
notificationRunning
){

notificationNextSoundTimer =
setTimeout(
() => {

if(
notificationRunning
){

playNotificationSound(
ride
);

}

},
2000
);

}

};


currentAudio
.play()
.catch(
error => {

console.error(
"通知音エラー",
error
);

}
);

}


/* =====================================
   音声案内
   ===================================== */

function speakTaxi(){

if(
!notificationRunning
){

return;

}


if(
!("speechSynthesis" in window)
){

return;

}


speechSynthesis.cancel();


const utterance =
new SpeechSynthesisUtterance(
"配車です。配車です。了解ボタンを押してください。"
);


utterance.lang =
"ja-JP";

utterance.rate =
1;

utterance.pitch =
1;

utterance.volume =
1;


speechSynthesis.speak(
utterance
);

}


/* =====================================
   配車通知画面
   ===================================== */

function showNotice(
ride
){

document.getElementById(
"noticePickup"
).textContent =
"📍 お迎え先：" +
(
ride.pickup ||
""
);


document.getElementById(
"noticeDestination"
).textContent =
"🏁 目的地：" +
(
ride.destination ||
""
);


document.getElementById(
"notice"
).style.display =
"block";

}


/* =====================================
   通知画面を閉じる
   ===================================== */

window.closeNoticeOnly =
function(){

document.getElementById(
"notice"
).style.display =
"none";

};


/* =====================================
   通知停止
   ===================================== */

function stopNotificationSound(){

notificationRunning =
false;

notificationRideId =
null;


if(
notificationNextSoundTimer
){

clearTimeout(
notificationNextSoundTimer
);

notificationNextSoundTimer =
null;

}


if(speechTimer){

clearInterval(
speechTimer
);

speechTimer =
null;

}


if(
notificationStopTimer
){

clearTimeout(
notificationStopTimer
);

notificationStopTimer =
null;

}


if(currentAudio){

currentAudio.pause();

currentAudio.currentTime =
0;

currentAudio.onended =
null;

currentAudio =
null;

}


if(
"speechSynthesis" in window
){

speechSynthesis.cancel();

}

}


/* =====================================
   通知ON
   ===================================== */

window.enableNotification =
function(){

notificationEnabled =
true;


try{

const audio =
new Audio(
sounds.normal
);

audio.volume =
0;

audio
.play()
.then(
() => {

audio.pause();

audio.currentTime =
0;

}
)
.catch(
() => {}
);

}catch(error){}


document.getElementById(
"soundButton"
).textContent =
"🔔 配車通知ON";


document.getElementById(
"soundStatus"
).textContent =
"🔔 配車通知がONになっています";

};


/* =====================================
   Google Maps
   ===================================== */

function openNavigation(
destination
){

if(!destination){

return;

}


const url =
"https://www.google.com/maps/dir/?" +
"api=1" +
"&destination=" +
encodeURIComponent(
destination
) +
"&travelmode=driving";


window.open(
url,
"_blank"
);

}


/* =====================================
   エラー表示
   ===================================== */

function showError(
message
){

const box =
document.getElementById(
"errorBox"
);

box.textContent =
"❌ " +
message;

box.style.display =
"block";

}


function clearError(){

const box =
document.getElementById(
"errorBox"
);

box.textContent =
"";

box.style.display =
"none";

}


/* =====================================
   エラーメッセージ
   ===================================== */

function getErrorMessage(
error
){

return (

(
error &&
error.code
?

error.code +
"\n"

:

""

) +

(
error &&
error.message

?

error.message

:

String(
error ||
"原因不明のエラーです。"
)

)

);

}


/* =====================================
   HTMLエスケープ
   ===================================== */

function escapeHtml(
text
){

const div =
document.createElement(
"div"
);


div.textContent =
text == null
?
""
:
String(
text
);


return div.innerHTML;

}


/* =====================================
   起動
   ===================================== */

start();

</script>
