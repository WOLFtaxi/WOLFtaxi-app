<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WOLFtaxi</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:#f7f7f7;
  color:#333;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.sub{
  font-size:14px;
  margin-top:5px;
  opacity:.8;
}

.card{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0 20px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:5px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.confirm{
  background:#e60023;
}

.driver{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

#result{
  display:none;
  margin-top:20px;
  padding:15px;
  background:#f1f1f1;
  border-radius:12px;
}

#complete{
  display:none;
  margin-top:20px;
  padding:20px;
  background:#fff0f2;
  border-radius:12px;
  text-align:center;
}

#complete h2{
  color:#e60023;
}

#driverScreen{
  display:none;
}

.notifyOn{
  background:#087f23;
}

#soundStatus{
  font-weight:bold;
}

.busy{
  margin-top:15px;
  padding:14px;
  background:#fff4d6;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  color:#8a5a00;
}

.ride{
  border:2px solid #e60023;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  background:white;
}

.ride button{
  background:#111;
}

.status{
  font-weight:bold;
  color:#e60023;
  font-size:18px;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

.notice{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:#e60023;
  color:white;
  padding:30px 20px;
  text-align:center;
  animation:blink .8s infinite;
}

.notice h1{
  font-size:44px;
  margin:20px 0;
}

.notice p{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
}

.notice .noticeBox{
  background:white;
  color:#222;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

.notice button{
  background:white;
  color:#e60023;
  margin-top:25px;
}

.noticeHint{
  font-size:20px;
  font-weight:bold;
  margin-top:18px;
}

.errorBox{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#ffe5e8;
  color:#b00020;
  border:2px solid #e60023;
  border-radius:12px;
  font-weight:bold;
  white-space:pre-wrap;
  word-break:break-word;
}

.loadingBox{
  display:none;
  margin-top:15px;
  padding:15px;
  background:#eef5ff;
  color:#174ea6;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:.82;
  }
}

.flash{
  animation:flashScreen .5s infinite alternate;
}

@keyframes flashScreen{
  from{
    box-shadow:inset 0 0 0 0 rgba(230,0,35,0);
  }
  to{
    box-shadow:inset 0 0 0 8px rgba(230,0,35,.5);
  }
}
</style>
</head>

<body>

<div class="header">
  🚕 WOLFtaxi
  <div class="sub">かんたんタクシー配車</div>
</div>


<!-- ========================= -->
<!-- お客様画面 -->
<!-- ========================= -->

<div class="card" id="customerScreen">

  <h2>📍 お迎え先</h2>

  <input
    id="pickup"
    type="text"
    placeholder="お迎え先を入力"
  >

  <h2>🏁 目的地</h2>

  <input
    id="destination"
    type="text"
    placeholder="目的地を入力"
  >

  <button onclick="callTaxi()">
    🚕 タクシーを呼ぶ
  </button>


  <div id="result">

    <h2>🚕 配車内容</h2>

    <p>📍 お迎え先</p>
    <p id="showPickup"></p>

    <p>🏁 目的地</p>
    <p id="showDestination"></p>

    <button
      id="confirmButton"
      class="confirm"
      onclick="confirmTaxi()"
    >
      ✅ この内容で配車する
    </button>

  </div>


  <div
    id="loadingBox"
    class="loadingBox"
  >
    🚕 配車を送信しています…
  </div>


  <div
    id="errorBox"
    class="errorBox"
  >
  </div>


  <div id="complete">

    <h2>🚕 配車を受け付けました</h2>

    <p>
      ドライバー001がお迎えにあがります。
    </p>

    <p>📍 お迎え先</p>
    <p id="completePickup"></p>

    <p>🏁 目的地</p>
    <p id="completeDestination"></p>

  </div>


  <div class="driver">
    ドライバー　001
  </div>

</div>



<!-- ========================= -->
<!-- ドライバー画面 -->
<!-- ========================= -->

<div class="card" id="driverScreen">

  <h2>🚕 ドライバー画面</h2>

  <div class="driver">
    ドライバー　001
  </div>


  <button
    id="soundButton"
    class="notifyOn"
    onclick="enableNotification()"
  >
    🔔 配車通知をON
  </button>


  <p
    id="soundStatus"
    class="driver"
  >
    配車通知をONにしてください
  </p>


  <div
    id="busyMessage"
    class="busy"
    style="display:none;"
  >
  </div>


  <hr>


  <div id="rideList">

    <div class="empty">
      配車を待っています…
    </div>

  </div>

</div>



<!-- ========================= -->
<!-- 配車通知画面 -->
<!-- ========================= -->

<div id="notice" class="notice">

  <div style="font-size:60px;">
    🚕
  </div>

  <h1>
    配車です！
  </h1>

  <div class="noticeBox">

    <p id="noticePickup"></p>

    <p id="noticeDestination"></p>

  </div>

  <div class="noticeHint">
    了解ボタンを押してください
  </div>

  <button onclick="stopNotification()">
    ✅ 了解
  </button>

</div>



<script type="module">

/* =========================================
   Firebase
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   Firebase設定
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDBe6rFCj51rGHfZnClQwyc-ANnQjjiZ54",

  authDomain:
    "wolftaxi-53314.firebaseapp.com",

  projectId:
    "wolftaxi-53314",

  storageBucket:
    "wolftaxi-53314.firebasestorage.app",

  messagingSenderId:
    "409259660325",

  appId:
    "1:409259660325:web:3506611653a617cccbdbcc",

  measurementId:
    "G-SX3VMEZJ92"

};


/* =========================================
   Firebase起動
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* =========================================
   Firebase認証状態
========================================= */

let firebaseReady =
  false;

let firebaseAuthError =
  null;


/*
  匿名ログインが完了するまで
  配車送信できないようにする
*/

const authReady =
  signInAnonymously(auth)

    .then(()=>{

      firebaseReady =
        true;

      firebaseAuthError =
        null;

      console.log(
        "Firebase認証OK"
      );

      startDriverMode();

    })

    .catch(error=>{

      firebaseReady =
        false;

      firebaseAuthError =
        error;

      console.error(
        "Firebase認証エラー",
        error
      );

      showError(
        "Firebase認証に失敗しました。\n" +
        getErrorMessage(error)
      );

    });



/* =========================================
   音声ファイル
========================================= */

const sounds = {

  normal:
    "mixkit-software-interface-start-2574.wav",

  haneda:
    "mixkit-arcade-bonus-alert-767.wav",

  narita:
    "mixkit-manual-siren-fire-alert-1652.wav",

  zaion:
    "mixkit-guitar-notification-alert-2320.wav"

};



/* =========================================
   通知関係
========================================= */

let notificationEnabled =
  false;

let notificationRunning =
  false;

let soundTimer =
  null;

let soundEndTimer =
  null;

let speechTimer =
  null;

let currentAudio =
  null;

let currentRideId =
  null;



/* =========================================
   配車ごとの音を選択
========================================= */

function getSoundFile(ride){

  const pickup =
    (ride.pickup || "")
      .trim();

  const destination =
    (ride.destination || "")
      .trim();


  /*
    優先順位

    1. ザイオン
    2. 成田
    3. 羽田
    4. 通常
  */

  if(
    pickup.includes("ザイオン")
  ){

    return sounds.zaion;

  }


  if(
    destination.includes("成田")
  ){

    return sounds.narita;

  }


  if(
    destination.includes("羽田")
  ){

    return sounds.haneda;

  }


  return sounds.normal;

}



/* =========================================
   効果音再生
========================================= */

function playNotificationSound(ride){

  if(!notificationEnabled){

    return;

  }


  try{

    if(currentAudio){

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }


    const soundFile =
      getSoundFile(ride);


    currentAudio =
      new Audio(soundFile);


    currentAudio.volume =
      1.0;


    currentAudio.play()
      .catch(error=>{

        console.error(
          "音声再生エラー",
          error
        );

      });

  }
  catch(error){

    console.error(
      "通知音エラー",
      error
    );

  }

}



/* =========================================
   音声読み上げ
========================================= */

function speakTaxi(){

  try{

    if(
      !("speechSynthesis" in window)
    ){

      return;

    }


    window.speechSynthesis.cancel();


    const message =
      new SpeechSynthesisUtterance(
        "配車です。配車です。了解ボタンを押してください。"
      );


    message.lang =
      "ja-JP";

    message.rate =
      1.0;

    message.pitch =
      1.0;

    message.volume =
      1.0;


    window.speechSynthesis.speak(
      message
    );

  }
  catch(error){

    console.error(
      "音声エラー",
      error
    );

  }

}



/* =========================================
   通知開始
========================================= */

function startNotification(
  ride,
  rideId
){

  if(
    !notificationEnabled
  ){

    showNotice(
      ride,
      rideId
    );

    return;

  }


  /*
    同じ通知なら無視
  */

  if(
    notificationRunning &&
    currentRideId === rideId
  ){

    return;

  }


  notificationRunning =
    true;

  currentRideId =
    rideId;


  showNotice(
    ride,
    rideId
  );


  stopSound();


  /*
    最初の音
  */

  playNotificationSound(
    ride
  );


  /*
    最初の読み上げ
  */

  speakTaxi();


  /*
    約4秒ごとに音を繰り返す
  */

  soundTimer =
    setInterval(

      ()=>{

        if(
          notificationRunning
        ){

          playNotificationSound(
            ride
          );

        }

      },

      4000

    );


  /*
    約6秒ごとに読み上げ
  */

  speechTimer =
    setInterval(

      ()=>{

        if(
          notificationRunning
        ){

          speakTaxi();

        }

      },

      6000

    );


  /*
    最大30秒
  */

  soundEndTimer =
    setTimeout(

      ()=>{

        stopNotification();

      },

      30000

    );

}



/* =========================================
   通知画面表示
========================================= */

function showNotice(
  ride,
  rideId
){

  const notice =
    document.getElementById(
      "notice"
    );


  document
    .getElementById(
      "noticePickup"
    )
    .textContent =
      "📍 お迎え先： " +
      (ride.pickup || "");


  document
    .getElementById(
      "noticeDestination"
    )
    .textContent =
      "🏁 目的地： " +
      (ride.destination || "");


  notice.dataset.rideId =
    rideId || "";


  notice.style.display =
    "block";


  document.body.classList.add(
    "flash"
  );

}



/* =========================================
   音停止
========================================= */

function stopSound(){

  if(soundTimer){

    clearInterval(
      soundTimer
    );

    soundTimer =
      null;

  }


  if(speechTimer){

    clearInterval(
      speechTimer
    );

    speechTimer =
      null;

  }


  if(soundEndTimer){

    clearTimeout(
      soundEndTimer
    );

    soundEndTimer =
      null;

  }


  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime =
      0;

    currentAudio =
      null;

  }


  if(
    "speechSynthesis"
    in window
  ){

    window.speechSynthesis.cancel();

  }

}



/* =========================================
   通知確認＋配車削除
========================================= */

window.stopNotification =
async function(){

  const rideId =
    currentRideId;


  stopSound();


  notificationRunning =
    false;


  currentRideId =
    null;


  document
    .getElementById(
      "notice"
    )
    .style.display =
      "none";


  document.body.classList.remove(
    "flash"
  );


  /*
    了解した配車を削除
  */

  if(rideId){

    try{

      await deleteDoc(
        doc(
          db,
          "rides",
          rideId
        )
      );

    }
    catch(error){

      console.error(
        "配車削除エラー",
        error
      );

      showError(
        "配車の削除に失敗しました。\n" +
        getErrorMessage(error)
      );

    }

  }

};



/* =========================================
   通知ON
========================================= */

window.enableNotification =
function(){

  notificationEnabled =
    true;


  /*
    ブラウザの音声再生許可を
    ボタン操作で取得
  */

  try{

    const testAudio =
      new Audio(
        sounds.normal
      );


    testAudio.volume =
      0;


    testAudio.play()
      .then(()=>{

        testAudio.pause();

        testAudio.currentTime =
          0;

      })
      .catch(error=>{

        console.log(
          "音声許可取得待ち",
          error
        );

      });

  }
  catch(error){

    console.error(
      error
    );

  }


  document
    .getElementById(
      "soundButton"
    )
    .textContent =
      "🔔 配車通知ON";


  document
    .getElementById(
      "soundStatus"
    )
    .textContent =
      "🔔 配車通知がONになっています";

};



/* =========================================
   エラー表示
========================================= */

function showError(message){

  const errorBox =
    document.getElementById(
      "errorBox"
    );


  if(!errorBox){

    return;

  }


  errorBox.textContent =
    "❌ " + message;


  errorBox.style.display =
    "block";

}



/* =========================================
   エラー表示を消す
========================================= */

function clearError(){

  const errorBox =
    document.getElementById(
      "errorBox"
    );


  if(!errorBox){

    return;

  }


  errorBox.textContent =
    "";

  errorBox.style.display =
    "none";

}



/* =========================================
   Firebaseエラー内容
========================================= */

function getErrorMessage(error){

  if(!error){

    return "原因不明のエラーです。";

  }


  return (
    error.code
      ? error.code + "\n"
      : ""
  ) +
  (
    error.message ||
    String(error)
  );

}



/* =========================================
   お客様画面
========================================= */

window.callTaxi =
function(){

  clearError();


  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();


  const destination =
    document
      .getElementById("destination")
      .value
      .trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "お迎え先と目的地を入力してください🚕"
    );

    return;

  }


  document
    .getElementById(
      "showPickup"
    )
    .textContent =
      pickup;


  document
    .getElementById(
      "showDestination"
    )
    .textContent =
      destination;


  document
    .getElementById(
      "result"
    )
    .style.display =
      "block";

};



/* =========================================
   配車送信
========================================= */

let sendingRide =
  false;


window.confirmTaxi =
async function(){

  if(sendingRide){

    return;

  }


  clearError();


  const pickup =
    document
      .getElementById("pickup")
      .value
      .trim();


  const destination =
    document
      .getElementById("destination")
      .value
      .trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "入力内容を確認してください"
    );

    return;

  }


  /*
    Firebase認証が完了するまで待つ
  */

  try{

    await authReady;

  }
  catch(error){

    showError(
      "Firebaseへの接続に失敗しました。\n" +
      getErrorMessage(
        firebaseAuthError || error
      )
    );

    return;

  }


  if(!firebaseReady){

    showError(
      "Firebaseに接続できていません。\n" +
      "ページを再読み込みして、もう一度お試しください。"
    );

    return;

  }


  sendingRide =
    true;


  const button =
    document.getElementById(
      "confirmButton"
    );


  const loadingBox =
    document.getElementById(
      "loadingBox"
    );


  button.disabled =
    true;


  button.textContent =
    "🚕 配車を送信中…";


  loadingBox.style.display =
    "block";


  /*
    Firestore書き込み
  */

  try{

    const rideRef =
      await addDoc(

        collection(
          db,
          "rides"
        ),

        {

          pickup:
            pickup,

          destination:
            destination,

          driver:
            "001",

          status:
            "requested",

          createdAt:
            serverTimestamp()

        }

      );


    console.log(
      "配車送信成功",
      rideRef.id
    );


    document
      .getElementById(
        "completePickup"
      )
      .textContent =
      pickup;


    document
      .getElementById(
        "completeDestination"
      )
      .textContent =
      destination;


    document
      .getElementById(
        "result"
      )
      .style.display =
      "none";


    loadingBox.style.display =
      "none";


    document
      .getElementById(
        "complete"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "pickup"
      )
      .value =
      "";


    document
      .getElementById(
        "destination"
      )
      .value =
      "";


    /*
      次の配車に備える
    */

    sendingRide =
      false;


    button.disabled =
      false;


    button.textContent =
      "🚕 配車を送信する";


  }
  catch(error){

    console.error(
      "配車送信エラー",
      error
    );


    sendingRide =
      false;


    button.disabled =
      false;


    button.textContent =
      "✅ この内容で配車する";


    loadingBox.style.display =
      "none";


    showError(
      "配車の送信に失敗しました。\n" +
      getErrorMessage(error)
    );

  }

};



/* =========================================
   ドライバー画面
========================================= */

function startDriverMode(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
    ?driver=001
  */

  if(
    params.get("driver") !==
    "001"
  ){

    return;

  }


  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "block";


  const ridesQuery =
    query(

      collection(
        db,
        "rides"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );


  let firstSnapshot =
    true;


  const knownRides =
    new Set();


  onSnapshot(

    ridesQuery,

    snapshot=>{

      const list =
        document.getElementById(
          "rideList"
        );


      const busyMessage =
        document.getElementById(
          "busyMessage"
        );


      /*
        配車件数
      */

      const rideCount =
        snapshot.size;


      if(
        rideCount > 0
      ){

        busyMessage.style.display =
          "block";


        busyMessage.textContent =
          "🚕 ただいま別の方の配車依頼対応中（" +
          rideCount +
          "件）";

      }
      else{

        busyMessage.style.display =
          "none";

      }


      /*
        配車なし
      */

      if(snapshot.empty){

        list.innerHTML =
          '<div class="empty">' +
          '現在、配車依頼はありません。' +
          '</div>';

        firstSnapshot =
          false;

        return;

      }


      list.innerHTML =
        "";


      snapshot.forEach(
        rideDoc=>{

          const ride =
            rideDoc.data();


          const rideId =
            rideDoc.id;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "ride";


          div.innerHTML = `

            <div class="status">
              🚕 新しい配車
            </div>

            <div>
              📍 お迎え先
            </div>

            <strong>
              ${escapeHtml(
                ride.pickup || ""
              )}
            </strong>

            <br><br>

            <div>
              🏁 目的地
            </div>

            <strong>
              ${escapeHtml(
                ride.destination || ""
              )}
            </strong>

            <br><br>

            <div>
              👨‍✈️ ドライバー：001
            </div>

            <button
              data-ride-id="${rideId}"
              class="manualAccept"
            >
              ✅ この配車を了解
            </button>

          `;


          list.appendChild(
            div
          );


          const acceptButton =
            div.querySelector(
              ".manualAccept"
            );


          acceptButton.addEventListener(
            "click",
            ()=>{

              acceptRide(
                rideId
              );

            }
          );


          /*
            新規配車だけ通知
          */

          if(

            !firstSnapshot &&

            ride.status ===
            "requested" &&

            !knownRides.has(
              rideId
            )

          ){

            startNotification(
              ride,
              rideId
            );

          }


          knownRides.add(
            rideId
          );

        }
      );


      /*
        初回読み込み済み
      */

      firstSnapshot =
        false;

    },

    error=>{

      console.error(
        "配車監視エラー",
        error
      );


      const list =
        document.getElementById(
          "rideList"
        );


      list.innerHTML =
        "";


      const errorDiv =
        document.createElement(
          "div"
        );


      errorDiv.className =
        "errorBox";


      errorDiv.style.display =
        "block";


      errorDiv.textContent =
        "❌ 配車情報の読み込みに失敗しました。\n" +
        getErrorMessage(error);


      list.appendChild(
        errorDiv
      );

    }

  );

}



/* =========================================
   一覧から直接了解
========================================= */

async function acceptRide(
  rideId
){

  /*
    通知中の配車なら
    通知も止める
  */

  if(
    currentRideId ===
    rideId
  ){

    stopSound();

    notificationRunning =
      false;

    currentRideId =
      null;


    document
      .getElementById(
        "notice"
      )
      .style.display =
      "none";


    document.body.classList.remove(
      "flash"
    );

  }


  try{

    await deleteDoc(
      doc(
        db,
        "rides",
        rideId
      )
    );


    console.log(
      "配車処理完了",
      rideId
    );

  }
  catch(error){

    console.error(
      "配車削除エラー",
      error
    );


    alert(
      "配車の処理に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

}



/* =========================================
   安全なHTML表示
========================================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}

</script>
