let driverDocId = "";

/* =====================================================

const sounds = {

  normal:

/* =====================================================
   Firebaseログイン
===================================================== */

async function start(){

  try{

    const credential =
      await signInAnonymously(auth);

    currentUser =
      credential.user;

    console.log(
      "Firebase認証OK",
      currentUser.uid
    );


    if(
      driverName
    ){

      driverDocId =
        currentUser.uid;

      await ensureDriverDocument();

      showDriverScreen();

    }
    else{

      showCustomerScreen();

    }

  }
  catch(error){

    console.error(
      error
    );

    alert(
      "Firebaseに接続できません。\n\n" +
      getErrorMessage(error)
    );

  }

}


/* =====================================================
   ドライバー登録
===================================================== */

window.registerDriver =
async function(){

  const input =
    document
      .getElementById(
        "driverNameInput"
      );

  const name =
    input.value.trim();


  if(!name){

    alert(
      "表示名を入力してください❤️"
    );

    return;

  }


  driverName =
    name;

  localStorage.setItem(
    "wolftaxi_driver_name",
    name
  );

  driverDocId =
    currentUser.uid;


  await ensureDriverDocument();

  showDriverScreen();

};


/* =====================================================
   ドライバー情報作成
===================================================== */

async function ensureDriverDocument(){

  if(!currentUser){

    return;

  }


  const ref =
    doc(
      db,
      "drivers",
      currentUser.uid
    );


  const snap =
    await getDoc(ref);


  if(!snap.exists()){

    await setDoc(
      ref,
      {

        name:
          driverName,

        status:
          "available",

        latitude:
          null,

        longitude:
          null,

        updatedAt:
          serverTimestamp()

      }
    );

  }
  else{

    await updateDoc(
      ref,
      {

        name:
          driverName,

        status:
          "available",

        updatedAt:
          serverTimestamp()

      }
    );

  }

}


/* =====================================================
   画面切り替え
===================================================== */

function showCustomerScreen(){

  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverRegistration"
    )
    .style.display =
      "none";


  initCustomerMap();

  listenDrivers();

  if(currentCustomerRideId){

    listenCustomerRide(
      currentCustomerRideId
    );

  }

}


function showDriverScreen(){

  document
    .getElementById(
      "customerScreen"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverRegistration"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "driverScreen"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "driverDisplayName"
    )
    .textContent =
      "👨‍✈️ " + driverName;


  initDriverMap();

  listenRides();

  startGPS();

}


/* =====================================================
   ドライバー画面のURL判定
===================================================== */

function detectMode(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  if(
    params.get("driver") === "1"
  ){

    if(driverName){

      showDriverScreen();

    }
    else{

      document
        .getElementById(
          "driverRegistration"
        )
        .style.display =
          "block";

      document
        .getElementById(
          "customerScreen"
        )
        .style.display =
          "none";

    }

  }
  else{

    showCustomerScreen();

  }

}


/* =====================================================
   タクシー一覧監視
===================================================== */

function listenDrivers(){

  const q =
    query(
      collection(
        db,
        "drivers"
      )
    );


  onSnapshot(
    q,
    snapshot=>{

      const list =
        document.getElementById(
          "driverStatusList"
        );


      list.innerHTML =
        "";


      if(snapshot.empty){

        list.innerHTML =
          '<div class="small">' +
          '現在登録されているタクシーはありません。' +
          '</div>';

        return;

      }


      snapshot.forEach(
        driverDoc=>{

          const driver =
            driverDoc.data();


          const id =
            driverDoc.id;


          const card =
            document.createElement(
              "div"
            );


          const status =
            driver.status ||
            "available";


          card.className =
            "statusCard " +
            status;


          card.innerHTML = `

            <div class="statusName">
              🚕 ${escapeHtml(
                driver.name || "タクシー"
              )}
            </div>

            <div class="statusText">
              ${statusLabel(status)}
            </div>

            <div class="small">
              ${
                driver.updatedAt
                  ? "現在位置を約60秒ごとに更新"
                  : "位置情報取得待ち"
              }
            </div>

          `;


          list.appendChild(
            card
          );


          if(
            driver.latitude != null &&
            driver.longitude != null
          ){

            updateCustomerMarker(
              id,
              driver
            );

          }

        }
      );

    },

    error=>{

      console.error(
        "ドライバー監視エラー",
        error
      );

    }

  );

}


/* =====================================================
   ステータス表示
===================================================== */

function statusLabel(status){

  switch(status){

    case "available":
      return "🟢 空車";

    case "pickup":
      return "🟡 迎車中";

    case "arrived":
      return "🔵 到着";

    case "riding":
      return "🔴 乗車中";

    default:
      return "⚫ 休車";

  }

}


/* =====================================================
   配車送信
===================================================== */

window.callTaxi =
function(){

  clearError();


  const pickup =
    document
      .getElementById(
        "pickup"
      )
      .value.trim();


  const destination =
    document
      .getElementById(
        "destination"
      )
      .value.trim();


  if(
    !pickup ||
    !destination
  ){

    alert(
      "お迎え先と目的地を入力してください🚕"
    );

    return;

  }


  document
    .getElementById(
      "showPickup"
    )
    .textContent =
      pickup;


  document
    .getElementById(
      "showDestination"
    )
    .textContent =
      destination;


  document
    .getElementById(
      "result"
    )
    .style.display =
      "block";

};


/* =====================================================
   配車確定
===================================================== */

window.confirmTaxi =
async function(){

  if(sendingRide){

    return;

  }


  clearError();


  const pickup =
    document
      .getElementById(
        "pickup"
      )
      .value.trim();


  const destination =
    document
      .getElementById(
        "destination"
      )
      .value.trim();


  if(
    !pickup ||
    !destination
  ){

    return;

  }


  sendingRide =
    true;


  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;


  button.textContent =
    "🚕 配車を送信中…";


  document
    .getElementById(
      "loadingBox"
    )
    .style.display =
      "block";


  try{

    const rideRef =
      await addDoc(

        collection(
          db,
          "rides"
        ),

        {

          pickup:
            pickup,

          destination:
            destination,

          status:
            "requested",

          acknowledgements:
            {},

          assignedDriverId:
            null,

          assignedDriverName:
            null,

          createdAt:
            serverTimestamp()

        }

      );


    currentCustomerRideId =
      rideRef.id;


    localStorage.setItem(
      "wolftaxi_customer_ride",
      rideRef.id
    );


    document
      .getElementById(
        "completePickup"
      )
      .textContent =
      pickup;


    document
      .getElementById(
        "completeDestination"
      )
      .textContent =
      destination;


    document
      .getElementById(
        "result"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "loadingBox"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "complete"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "customerRideInfo"
      )
      .style.display =
      "block";


    listenCustomerRide(
      rideRef.id
    );


    sendingRide =
      false;


    button.disabled =
      false;


    button.textContent =
      "🚕 この内容で配車する";


  }
  catch(error){

    sendingRide =
      false;


    button.disabled =
      false;


    button.textContent =
      "🚕 この内容で配車する";


    document
      .getElementById(
        "loadingBox"
      )
      .style.display =
      "none";


    showError(
      "配車の送信に失敗しました。\n" +
      getErrorMessage(error)
    );

  }

};


/* =====================================================
   ドライバー配車監視
===================================================== */

function listenRides(){

  const q =
    query(
      collection(
        db,
        "rides"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  let firstSnapshot =
    true;


  const knownRides =
    new Set();


  onSnapshot(

    q,

    snapshot=>{

      const list =
        document.getElementById(
          "rideList"
        );


      list.innerHTML =
        "";


      if(snapshot.empty){

        list.innerHTML =
          '<div class="small">' +
          '現在、配車依頼はありません。' +
          '</div>';

        firstSnapshot =
          false;

        return;

      }


      snapshot.forEach(
        rideDoc=>{

          const ride =
            rideDoc.data();


          const rideId =
            rideDoc.id;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "ride";


          const acknowledgements =
            ride.acknowledgements ||
            {};


          const alreadyAcknowledged =
            !!acknowledgements[
              currentUser.uid
            ];


          const assigned =
            ride.assignedDriverId;


          let buttons = "";


          if(
            ride.status ===
            "requested"
          ){

            if(
              alreadyAcknowledged
            ){

              buttons += `

                <button
                  class="gray"
                  disabled
                >
                  ✅ 了解済み
                </button>

              `;

            }
            else{

              buttons += `

                <button
                  class="blue"
                  data-action="ack"
                >
                  ✅ この配車を了解
                </button>

              `;

            }


            if(
              assigned ===
              currentUser.uid
            ){

              buttons += `

                <button
                  class="orange"
                  data-action="pickup"
                >
                  🚕 迎車開始
                </button>

              `;

            }

          }


          if(
            ride.status ===
            "pickup" &&
            assigned ===
            currentUser.uid
          ){

            buttons += `

              <button
                class="blue"
                data-action="arrived"
              >
                📍 到着報告
              </button>

            `;

          }


          if(
            ride.status ===
            "arrived" &&
            assigned ===
            currentUser.uid
          ){

            buttons += `

              <button
                class="orange"
                data-action="riding"
              >
                🚕 お送り中
              </button>

            `;

          }


          if(
            ride.status ===
            "riding" &&
            assigned ===
            currentUser.uid
          ){

            buttons += `

              <button
                class="confirm"
                data-action="complete"
              >
                ✅ 完了報告
              </button>

            `;

          }


          if(
            assigned &&
            assigned !==
            currentUser.uid
          ){

            buttons += `

              <div class="infoBox">
                🚕 ${escapeHtml(
                  ride.assignedDriverName ||
                  "他のドライバー"
                )}
                が担当しています。
              </div>

            `;

          }


          div.innerHTML = `

            <div class="rideTitle">
              🚕 配車
            </div>

            <div>
              📍 お迎え先
            </div>

            <strong>
              ${escapeHtml(
                ride.pickup || ""
              )}
            </strong>

            <br><br>

            <div>
              🏁 目的地
            </div>

            <strong>
              ${escapeHtml(
                ride.destination || ""
              )}
            </strong>

            <div class="ackList">

              <strong>
                👨‍✈️ 了解状況
              </strong>

              <div
                class="ackContainer"
              ></div>

            </div>

            ${buttons}

          `;


          list.appendChild(
            div
          );


          const ackContainer =
            div.querySelector(
              ".ackContainer"
            );


          Object.entries(
            acknowledgements
          ).forEach(
            ([uid,data])=>{

              const row =
                document.createElement(
                  "div"
                );

              row.className =
                "ackRow";


              row.textContent =
                "🟢 " +
                (
                  data.name ||
                  "ドライバー"
                ) +
                "　了解済み";


              ackContainer.appendChild(
                row
              );

            }
          );


          if(
            Object.keys(
              acknowledgements
            ).length === 0
          ){

            ackContainer.innerHTML =
              '<div class="small">' +
              'まだ了解した車両はありません。' +
              '</div>';

          }


          const ackButton =
            div.querySelector(
              '[data-action="ack"]'
            );


          if(ackButton){

            ackButton.onclick =
              ()=>{
                acknowledgeRide(
                  rideId
                );
              };

          }


          const pickupButton =
            div.querySelector(
              '[data-action="pickup"]'
            );


          if(pickupButton){

            pickupButton.onclick =
              ()=>{
                startPickup(
                  rideId
                );
              };

          }


          const arrivedButton =
            div.querySelector(
              '[data-action="arrived"]'
            );


          if(arrivedButton){

            arrivedButton.onclick =
              ()=>{
                reportArrived(
                  rideId
                );
              };

          }


          const ridingButton =
            div.querySelector(
              '[data-action="riding"]'
            );


          if(ridingButton){

            ridingButton.onclick =
              ()=>{
                startRiding(
                  rideId,
                  ride.destination
                );
              };

          }


          const completeButton =
            div.querySelector(
              '[data-action="complete"]'
            );


          if(completeButton){

            completeButton.onclick =
              ()=>{
                completeRide(
                  rideId
                );
              };

          }


          if(

            !firstSnapshot &&

            ride.status ===
            "requested" &&

            !knownRides.has(
              rideId
            )

          ){

            startNotification(
              ride,
              rideId
            );

          }


          knownRides.add(
            rideId
          );

        }
      );


      firstSnapshot =
        false;

    },

    error=>{

      console.error(
        "配車監視エラー",
        error
      );

    }

  );

}


/* =====================================================
   配車を了解
===================================================== */

async function acknowledgeRide(
  rideId
){

  try{

    const ref =
      doc(
        db,
        "rides",
        rideId
      );


    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      return;

    }


    const ride =
      snap.data();


    const acknowledgements =
      ride.acknowledgements ||
      {};


    acknowledgements[
      currentUser.uid
    ] = {

      name:
        driverName,

      at:
        new Date().toISOString()

    };


    await updateDoc(
      ref,
      {

        acknowledgements:
          acknowledgements

      }
    );


    alert(
      "✅ 了解済みにしました❤️"
    );

  }
  catch(error){

    alert(
      "了解処理に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

}


/* =====================================================
   迎車開始
===================================================== */

async function startPickup(
  rideId
){

  try{

    const ref =
      doc(
        db,
        "rides",
        rideId
      );


    await runTransaction(
      db,
      async transaction=>{

        const snap =
          await transaction.get(
            ref
          );


        if(!snap.exists()){

          throw new Error(
            "配車が見つかりません。"
          );

        }


        const ride =
          snap.data();


        if(
          ride.assignedDriverId &&
          ride.assignedDriverId !==
          currentUser.uid
        ){

          throw new Error(
            "この配車は他のドライバーが担当しています。"
          );

        }


        transaction.update(
          ref,
          {

            assignedDriverId:
              currentUser.uid,

            assignedDriverName:
              driverName,

            status:
              "pickup",

            startedAt:
              serverTimestamp()

          }
        );

      }
    );


    await setDriverStatus(
      "pickup"
    );

  }
  catch(error){

    alert(
      "迎車開始に失敗しました。\n\n" +
      getErrorMessage(error)
    );

  }

}

/* =====================================================
   GPS
===================================================== */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    console.log(
      "GPS非対応"
    );

    return;

  }


  const updateLocation =
    ()=>{
      
      navigator.geolocation.getCurrentPosition(

        async position=>{

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          try{

            await updateDoc(

              doc(
                db,
                "drivers",
                currentUser.uid
              ),

              {

                latitude:
                  lat,

                longitude:
                  lng,

                updatedAt:
                  serverTimestamp()

              }

            );


            updateDriverMap(
              lat,
              lng
            );

          }
          catch(error){

            console.error(
              "GPS保存エラー",
              error
            );

          }

        },

        error=>{

          console.error(
            "GPS取得エラー",
            error
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            30000

        }

      );

    };


  updateLocation();


  setInterval(
    updateLocation,
    60000
  );

}

===================================================== */

function updateCustomerRideDisplay(

  let text =
    "";


  switch(status){

    case "requested":

      text =
        "🚕 配車依頼を送信しました。";

      break;


    case "pickup":

      break;


    case "arrived":

      text =
        "🔵 タクシーが到着しました。";

      break;


    case "riding":

      text =
        "🔴 ただいま乗車中です。";

      break;


    default:

      text =
        "🚕 配車処理中です。";

  }


  document
    .getElementById(
      "customerQueueText"
    )
    .textContent =
      text;


  const ackList =
    document.getElementById(
      "customerAckList"
    );


  ackList.innerHTML =
    "<strong>👨‍✈️ 配車確認状況</strong>";


  const acknowledgements =
    ride.acknowledgements ||
    {};


  const entries =
    Object.values(
      acknowledgements
    );


  if(entries.length === 0){

    ackList.innerHTML +=
      "<div class='small'>" +
      "まだ了解したタクシーはありません。" +
      "</div>";

  }
  else{

    entries.forEach(
      data=>{

        ackList.innerHTML +=
          "<div class='ackRow'>" +
          "🟢 " +
          escapeHtml(
            data.name ||
            "タクシー"
          ) +
          "　了解済み" +
          "</div>";

      }
    );

  }


  if(
    ride.assignedDriverId
  ){

    ackList.innerHTML +=
      "<div class='ackRow'>" +
      "🚕 担当：" +
      escapeHtml(
        ride.assignedDriverName ||
        ""
      ) +
      "</div>";

  }


  if(
    ride.assignedDriverId
  ){

    listenAssignedDriverLocation(
      ride.assignedDriverId
    );

  }

}

){

  if(!customerRideMap){

  onSnapshot(

    doc(
      db,
      "drivers",
      driverId

    snapshot=>{

      if(!snapshot.exists()){

      }


      const driver =
        snapshot.data();


      if(
        driver.latitude == null ||

      ){

/* =====================================================
   通知音
===================================================== */

function getSoundFile(
  ride
){

  const pickup =
    (
      ride.pickup ||
      ""
    ).trim();


  const destination =
    (
      ride.destination ||
      ""
    ).trim();


  if(
    pickup.includes(
      "ザイオン"
    )
  ){

    return sounds.zaion;

  }


  if(
    destination.includes(
      "成田"
    )
  ){

    return sounds.narita;

  }


  if(
    destination.includes(
      "羽田"
    )
  ){

    return sounds.haneda;

  }


  return sounds.normal;

}


/* =====================================================
   通知開始
===================================================== */

function startNotification(
  ride,
  rideId
){

  if(!notificationEnabled){

    showNotice(
      ride
    );

    return;

  }


  if(
    notificationRunning &&
    notificationRideId ===
    rideId
  ){

    return;

  }


  stopNotificationSound();


  notificationRunning =
    true;

  notificationRideId =
    rideId;


  showNotice(
    ride
  );


  playNotificationSound(
    ride
  );


  speakTaxi();


  /*
    音声ファイルが終わったら
    2秒待ってから再生する。
  */

  soundTimer =
    setInterval(

      ()=>{

        if(
          notificationRunning
        ){

          playNotificationSound(
            ride
          );

        }

      },

      5000

    );


  speechTimer =
    setInterval(

      ()=>{

        if(
          notificationRunning
        ){

          speakTaxi();

        }

      },

      7000

    );


  soundEndTimer =
    setTimeout(

      ()=>{

        stopNotificationSound();

      },

      30000

    );

}


/* =====================================================
   音声再生
===================================================== */

function playNotificationSound(
  ride
){

  if(!notificationEnabled){

    return;

  }


  try{

    if(currentAudio){

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }


    currentAudio =
      new Audio(
        getSoundFile(
          ride
        )
      );


    currentAudio.volume =
      1;


    currentAudio.play()
      .catch(
        error=>{
          console.error(
            "通知音エラー",
            error
          );
        }
      );

  }
  catch(error){

    console.error(
      error
    );

  }

}


/* =====================================================
   音声読み上げ
===================================================== */

function speakTaxi(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      "配車です。配車です。了解ボタンを押してください。"
    );


  utterance.lang =
    "ja-JP";

  utterance.rate =
    1;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  window.speechSynthesis.speak(
    utterance
  );

}

function stopNotificationSound(){

  notificationRunning =
    false;


  notificationRideId =
    null;


  if(soundTimer){

    clearInterval(
      soundTimer
    );

    soundTimer =
      null;

  }


  if(speechTimer){

    clearInterval(
      speechTimer
    );

    speechTimer =
      null;

  }


  if(soundEndTimer){

    clearTimeout(
      soundEndTimer
    );

    soundEndTimer =
      null;

  }


  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime =
      0;

    currentAudio =
      null;

  }


  if(
    "speechSynthesis"
    in window
  ){

    window.speechSynthesis.cancel();

  }

}

        }
      );

  catch(error){

    );

  }


  document

    )

      "🔔 配車通知ON";

    .getElementById(
      "soundStatus"
    )
    .textContent =

};

function openNavigation(
  destination
){

  if(!destination){

    return;

  }


  const encoded =
    encodeURIComponent(
      destination
    );


  const url =
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encoded +
    "&travelmode=driving";


  window.open(
    url,
    "_blank"
  );

}

){

    document.getElementById(
      "errorBox"
    );

    "";

function getErrorMessage(
  error
